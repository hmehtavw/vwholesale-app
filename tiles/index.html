<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a2744">
<title>Tile Stock Desk — V Wholesale</title>
<style>
:root{
  --navy:#1a2744; --navy-2:#24344f; --gold:#c9a84c;
  --ink:#12192b; --muted:#6b7891; --line:#e3e7ef; --bg:#f4f6fa; --card:#fff;
  --ok:#12805c; --ok-bg:#e6f5ef; --warn:#a86612; --warn-bg:#fdf3e2; --bad:#b3261e; --bad-bg:#fdecea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
.hide{display:none!important}

/* ---------- login ---------- */
#login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  padding:28px 22px;background:var(--navy)}
.brand{text-align:center;margin-bottom:34px}
.brand b{display:block;color:#fff;font-size:27px;letter-spacing:.14em;font-weight:700}
.brand span{display:block;color:var(--gold);font-size:11px;letter-spacing:.3em;margin-top:7px}
.brand i{display:block;color:#8fa0bd;font-size:15px;font-style:normal;margin-top:20px;letter-spacing:.02em}
.field{margin-bottom:15px}
label{display:block;font-size:12px;color:#8fa0bd;margin-bottom:7px;letter-spacing:.09em;text-transform:uppercase}
input{width:100%;padding:15px 16px;font-size:17px;border:1.5px solid #35455f;border-radius:11px;
  background:var(--navy-2);color:#fff;outline:none}
input:focus{border-color:var(--gold)}
input::placeholder{color:#5f7089}
#pin{letter-spacing:.42em;font-size:21px}
.btn{width:100%;padding:16px;font-size:16px;font-weight:700;border:0;border-radius:11px;
  background:var(--gold);color:var(--navy);cursor:pointer;letter-spacing:.03em}
.btn:disabled{opacity:.55}
.err{background:rgba(255,120,110,.13);border:1px solid rgba(255,120,110,.4);color:#ffb4ae;
  padding:11px 13px;border-radius:9px;font-size:14px;margin-bottom:15px}

/* ---------- app ---------- */
header{background:var(--navy);color:#fff;padding:13px 16px;display:flex;
  align-items:center;gap:12px;position:sticky;top:0;z-index:10;
  padding-top:calc(13px + env(safe-area-inset-top))}
header .who{flex:1;min-width:0}
header .who b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .who span{font-size:11px;color:var(--gold);letter-spacing:.13em}
header button{background:transparent;border:1px solid #46587a;color:#c3cede;
  padding:8px 13px;border-radius:8px;font-size:13px}
main{padding:16px;max-width:640px;margin:0 auto}
.searchbar{display:flex;gap:9px;margin-bottom:16px}
.searchbar input{background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-size:17px}
.searchbar button{padding:0 22px;border:0;border-radius:11px;background:var(--navy);
  color:#fff;font-weight:700;font-size:15px}

.msg{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:26px 20px;text-align:center;color:var(--muted)}

.mhead{background:var(--navy);color:#fff;border-radius:13px;padding:15px 17px;margin-bottom:11px}
.mhead b{font-size:21px;letter-spacing:.02em}
.mhead span{display:block;color:#93a3bf;font-size:13px;margin-top:3px}

.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:15px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 9px;text-align:center}
.c i{display:block;font-style:normal;font-size:10px;letter-spacing:.11em;color:var(--muted);margin-bottom:5px}
.c b{font-size:22px;font-weight:700}
.c.avail{background:var(--ok-bg);border-color:#b6e0cf;grid-column:span 1}
.c.avail b{color:var(--ok);font-size:27px}

.loc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);
  border-radius:12px;padding:14px 16px;margin-bottom:10px}
.loc.low{border-left-color:var(--warn)} .loc.zero{border-left-color:var(--bad);opacity:.75}
.loc .ln{font-weight:700;font-size:16px;margin-bottom:2px}
.loc .lt{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:10px}
.qty{display:flex;gap:18px;margin-bottom:12px}
.qty div{font-size:13px;color:var(--muted)}
.qty div b{display:block;font-size:19px;color:var(--ink);font-weight:700}
.qty div.a b{color:var(--ok)} .loc.low .qty div.a b{color:var(--warn)} .loc.zero .qty div.a b{color:var(--bad)}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;
  background:var(--warn-bg);color:var(--warn);margin-bottom:9px}
.acts{display:flex;gap:9px}
.acts.step{align-items:center;gap:8px}
.acts.step button{width:38px;height:38px;border-radius:9px;border:1.5px solid var(--line);
  background:#fff;font-size:19px;font-weight:700;color:var(--navy);line-height:1;flex:0 0 auto}
.acts.step input{flex:1;text-align:center;font-size:16px;font-weight:700;padding:9px 4px}
.acts button{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--navy);
  background:#fff;color:var(--navy);font-weight:700;font-size:14px}
.acts button.soon{border-color:var(--line);color:#9aa5b8}

/* cart + modal */
.tabs{display:flex;gap:7px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border-radius:9px;border:1.5px solid var(--line);
  background:#fff;color:var(--muted);font-weight:600;font-size:13px}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.cartbar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;
  align-items:center;z-index:40;box-shadow:0 -3px 14px rgba(0,0,0,.16)}
.cartbar .n{flex:1;font-size:14px}
.cartbar .n b{font-size:17px;display:block}
.cartbar button{padding:11px 15px;border:0;border-radius:9px;font-weight:700;font-size:14px}
.cartbar .sell{background:var(--gold);color:var(--navy)}
.cartbar .hold{background:#33455f;color:#fff}
.ov{position:fixed;inset:0;background:rgba(10,16,28,.55);z-index:50;display:flex;
  align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:16px 16px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.sheet label{color:var(--muted);text-transform:none;letter-spacing:0;font-size:12px}
.sheet input,.sheet textarea,.sheet select{background:#fff;border:1.5px solid var(--line);
  color:var(--ink);font-size:16px;border-radius:10px;padding:12px 13px;width:100%}
.sheet textarea{min-height:64px;font-family:inherit}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .lm{flex:1;min-width:0}
.line .lm b{display:block;font-size:15px}
.line .lm span{font-size:12px;color:var(--muted)}
.line input{width:74px;text-align:center;padding:9px}
.line .x{background:none;border:0;color:var(--bad);font-size:20px;padding:0 4px}
.sheet .go{background:var(--gold);color:var(--navy);font-weight:700;border:0;
  border-radius:11px;padding:15px;width:100%;font-size:16px;margin-top:6px}
.sheet .cancel{background:none;border:0;color:var(--muted);width:100%;padding:13px;font-size:14px}
.serr{background:var(--bad-bg);color:var(--bad);border:1px solid #f3c9c5;padding:10px 12px;
  border-radius:9px;font-size:14px;margin-bottom:12px}
.sok{background:var(--ok-bg);color:var(--ok);border:1px solid #b6e0cf;padding:14px;
  border-radius:10px;font-size:15px;margin-bottom:12px}
.photo{border:1.5px dashed var(--line);border-radius:11px;padding:16px;text-align:center;
  color:var(--muted);font-size:14px;margin-bottom:13px}
.photo.has{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.photo input{display:none}
.hold-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.hold-card.exp{border-left:4px solid var(--bad)}
.hold-card b{font-size:16px}
.hold-card .meta{font-size:13px;color:var(--muted);margin-top:4px}
.badge{display:inline-block;font-size:10px;padding:3px 8px;border-radius:12px;
  background:var(--warn-bg);color:var(--warn);margin-left:6px;letter-spacing:.06em}
.badge.red{background:var(--bad-bg);color:var(--bad)}
.pad{padding-bottom:86px}
.fam{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:10px;cursor:pointer}
.fam:active{background:#f7f9fc}
.famhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.famhead b{font-size:18px;display:block}
.famhead span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.famq{text-align:right;flex-shrink:0}
.famq i{display:block;font-style:normal;font-size:9px;letter-spacing:.11em;color:var(--muted)}
.famq b{font-size:24px;color:var(--ok)}
.famsub{font-size:12px;color:var(--muted);margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.tap{color:var(--gold);font-weight:600;float:right}
.choose button{display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:9px;font-size:16px;font-weight:600}
.foot{text-align:center;color:#9aa5b8;font-size:11px;margin:26px 0 10px;letter-spacing:.05em}

/* ---------- data editor ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 13px;border-radius:20px;border:1.5px solid var(--line);
  background:#fff;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip b{margin-left:5px;opacity:.75}
.gridtools{display:flex;gap:9px;margin-bottom:13px}
.gridtools button{flex:1;padding:11px;border-radius:10px;border:1.5px dashed var(--line);
  background:#fff;color:var(--navy);font-weight:700;font-size:13px}
.grow{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;margin-bottom:9px}
.grow .gh{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.grow .gt{min-width:0}
.grow .gt b{display:block;font-size:16px}
.grow .gt span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.grow .step{display:flex;align-items:center;gap:8px;flex-shrink:0}
.grow .step button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);
  background:#fff;font-size:17px;font-weight:700;color:var(--navy);line-height:1}
.grow .step input{width:52px;text-align:center;padding:6px 2px;font-size:15px}
.tagrow{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:10px;padding:3px 8px;border-radius:10px;letter-spacing:.05em}
.tag.notlive{background:var(--bad-bg);color:var(--bad)}
.tag.pending{background:var(--warn-bg);color:var(--warn)}
.tag.dup{background:#eee3fb;color:#6b3fa0}
.shared-lbl{display:inline-block;font-size:10px;color:var(--gold);letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:4px}
.field.shared input{border-color:#e7d6a3;background:#fffaf0}
.more{width:100%;padding:13px;border-radius:11px;border:1.5px solid var(--line);
  background:#fff;color:var(--navy);font-weight:700;font-size:14px;margin-top:4px}
.danger{background:#fff!important;border:1.5px solid #f3c9c5!important;color:#b3261e!important}
.duppanel{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.dupline{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 0;flex-wrap:wrap}
.dupline .dt b{font-size:13px}
.dupline .dt span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.dupacts{display:flex;gap:6px;flex-shrink:0}
.dupacts button{padding:7px 10px;border-radius:8px;font-size:11px;font-weight:700;border:1.5px solid var(--line);background:#fff}
.dupacts .dupyes{border-color:#eee3fb;color:#6b3fa0}
.dupacts .dupno{color:var(--muted)}
.dupnote{font-size:11px;color:var(--muted);margin-bottom:6px;font-style:italic}
.pgal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.pgal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
</style>
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<body>

<!-- ===== LOGIN ===== -->
<section id="login">
  <div class="brand">
    <b>V WHOLESALE</b>
    <span>BUILD BETTER. PAY LESS.</span>
    <i>Tile Stock Desk</i>
  </div>
  <div id="lerr" class="err hide"></div>
  <div class="field">
    <label for="who">Your name</label>
    <input id="who" autocomplete="name" placeholder="e.g. Ravi">
  </div>
  <div class="field">
    <label for="pin">Employee PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••">
  </div>
  <button class="btn" id="lbtn">Sign in</button>
</section>

<!-- ===== APP ===== -->
<div id="app" class="hide">
  <header>
    <button id="back" class="hide" style="padding:8px 11px">‹</button>
    <div class="who" id="whoBtn" style="cursor:pointer"><b id="hname"></b><span id="hrole"></span></div>
    <button id="pinBtn" class="hide" style="margin-right:2px">PINs</button>
    <button id="out">Sign out</button>
  </header>
  <main>
    <div class="searchbar" id="searchbar">
      <input id="q" placeholder="10408-D" autocomplete="off" enterkeyhint="search">
      <button id="go">Search</button>
    </div>
    <div class="tabs">
      <button id="tabStock" class="on">Stock</button>
      <button id="tabHolds">Holds</button>
      <button id="tabAdmin" class="hide">Approvals</button>
      <button id="tabEditor" class="hide">Editor</button>
    </div>
    <div id="res"></div>
    <div class="foot">TEMPORARY STOCK DESK · INTERNAL USE</div>
  </main>
</div>
<div id="cartbar" class="cartbar hide">
  <div class="n"><b><span id="cq">0</span> boxes</b><span id="ci">0 items</span></div>
  <button class="hold hide" id="doDmg">Damage</button>
  <button class="hold hide" id="doXfer">Transfer</button>
  <button class="hold" id="doHold">Hold</button>
  <button class="sell" id="doSale">Record Sale</button>
</div>
<div id="ov" class="ov hide"><div class="sheet" id="sheet"></div></div>

<script>
const API = 'https://ndamdnlsuktucqtcbhgp.supabase.co/functions/v1/temp-tiles-api';
let TOKEN = sessionStorage.getItem('vwt_token') || '';
let NAME  = sessionStorage.getItem('vwt_name')  || '';
let ROLE  = sessionStorage.getItem('vwt_role')  || '';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function call(payload){
  try{
    const r = await fetch(API, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ ...payload, token: TOKEN })
    });
    return await r.json();
  }catch(e){
    return { ok:false, error:'No connection. Check your internet and try again.' };
  }
}

/* ---------- login ---------- */
$('lbtn').onclick = async () => {
  const who = $('who').value.trim(), pin = $('pin').value.trim();
  $('lerr').classList.add('hide');
  if(!who || !pin){ return showErr('Enter your name and PIN'); }
  $('lbtn').disabled = true; $('lbtn').textContent = 'Signing in…';
  const d = await call({ action:'login', pin, staff_name: who });
  $('lbtn').disabled = false; $('lbtn').textContent = 'Sign in';
  if(!d.ok) return showErr(d.error);
  TOKEN = d.token; NAME = d.staff_name; ROLE = d.role;
  sessionStorage.setItem('vwt_token',TOKEN);
  sessionStorage.setItem('vwt_name',NAME);
  sessionStorage.setItem('vwt_role',ROLE);
  $('pin').value = '';
  enter();
};
$('pin').addEventListener('keydown', e => { if(e.key==='Enter') $('lbtn').click(); });
function showErr(m){ $('lerr').textContent = m; $('lerr').classList.remove('hide'); }

function enter(){
  $('hname').textContent = NAME;
  $('hrole').textContent = ROLE;
  if(ROLE==='ADMIN') $('tabAdmin').classList.remove('hide');
  if(ROLE==='ADMIN') $('pinBtn').classList.remove('hide');
  if(ROLE==='ADMIN'||ROLE==='INVENTORY') $('doDmg').classList.remove('hide');
  if(ROLE==='ADMIN'||ROLE==='INVENTORY') $('doXfer').classList.remove('hide');
  if(ROLE==='ADMIN'||ROLE==='INVENTORY') $('tabEditor').classList.remove('hide');
  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  $('q').focus();
}

$('out').onclick = async () => {
  await call({ action:'logout' });
  sessionStorage.clear(); location.reload();
};

/* ---------- search ---------- */
$('go').onclick = search;
$('q').addEventListener('keydown', e => { if(e.key==='Enter') search(); });

async function search(term, exact){
  const q = typeof term === 'string' ? term : $('q').value.trim();
  if(!exact && q.length < 2) return;
  $('res').innerHTML = '<div class="msg">Searching…</div>';
  const d = await call(exact ? { action:'search', model_code:exact } : { action:'search', query:q });

  if(!d.ok){
    $('res').innerHTML = '<div class="msg">'+esc(d.error)+'</div>';
    if(String(d.error).includes('session')){ sessionStorage.clear(); setTimeout(()=>location.reload(),1600); }
    return;
  }
  if(d.mode === 'none')   return $('res').innerHTML = '<div class="msg"><b>Tile code not found</b><br>Check the code and try again.</div>';
  if(d.mode === 'family') return renderFamily(d);
  renderModel(d);
}

function locRows(list){
  return list.map(l => {
    const a = Number(l.available_qty);
    const cls = a <= 0 ? 'zero' : (a <= 5 ? 'low' : '');
    const inCart = CART.find(c => c.model_id===l.model_id && c.location_id===l.location_id);
    const qty = inCart ? inCart.qty : 0;
    return '<div class="loc '+cls+'" data-mid="'+esc(l.model_id)+'" data-lid="'+esc(l.location_id)+'" data-lname="'+esc(l.location_name)+'" data-avail="'+a+'">'+
      '<div class="ln">'+esc(l.location_name)+'</div>'+
      '<div class="lt">'+esc(String(l.location_type).replace(/_/g,' '))+'</div>'+
      '<div class="qty">'+
        '<div>Physical<b>'+l.physical_qty+'</b></div>'+
        '<div>Held<b>'+l.held_qty+'</b></div>'+
        '<div class="a">Available<b>'+a+'</b></div>'+
      '</div>'+
      (a > 0
        ? '<div class="acts step"><button data-ostep="-1">−</button><input type="number" data-oqty value="'+qty+'" readonly><button data-ostep="1">+</button></div>'
        : '<div class="acts"><button class="soon" disabled>No stock here</button></div>')+
      '</div>';
  }).join('');
}
function wireAdd(mid, mcode){
  $('res').querySelectorAll('.loc[data-lid]').forEach(el => {
    const {mid: emid, lid, lname, avail} = {mid: el.dataset.mid, lid: el.dataset.lid, lname: el.dataset.lname, avail: Number(el.dataset.avail)};
    const inp = el.querySelector('[data-oqty]');
    if(!inp) return;
    el.querySelectorAll('[data-ostep]').forEach(btn => btn.onclick = () => {
      const delta = Number(btn.dataset.ostep);
      const newQty = Math.max(0, Math.min(Number(inp.value||0) + delta, avail));
      inp.value = newQty;
      setCartQty(emid, mcode, lid, lname, avail, newQty);
    });
  });
}
function setCartQty(mid, mcode, lid, lname, avail, qty){
  const idx = CART.findIndex(c => c.model_id===mid && c.location_id===lid);
  if(qty <= 0){ if(idx>=0) CART.splice(idx,1); }
  else if(idx>=0){ CART[idx].qty = qty; }
  else CART.push({model_id:mid, model_code:mcode, location_id:lid, location_name:lname, qty, available:avail});
  paintCart();
}

function renderFamily(d){
  LAST = d.query; $('back').classList.remove('hide');
  const withStock = d.family.filter(f => f.totals.physical > 0);
  const empty     = d.family.filter(f => f.totals.physical === 0);

  let h = '<div class="msg" style="margin-bottom:12px;text-align:left">'+
    '<b>'+withStock.length+'</b> match'+(withStock.length===1?'':'es')+' for “'+esc(d.query)+'”'+
    (empty.length ? ' · '+empty.length+' with no stock' : '')+'</div>';

  h += withStock.map(f =>
    '<div class="fam" data-c="'+esc(f.model_code)+'">'+
      '<div class="famhead">'+
        '<div><b>'+esc(f.model_code)+'</b>'+

/* ================= PHOTO (multi-image) ================= */
async function shrink(file){
  const img = await createImageBitmap(file);
  const max = 1400, sc = Math.min(1, max/Math.max(img.width,img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return await new Promise(r => cv.toBlob(r,'image/jpeg',0.75));
}
async function uploadPhoto(file, kind){
  try{
    const blob = await shrink(file);
    const d = await call({action:'upload_url', kind});
    if(!d.ok) return null;
    const r = await fetch(d.signed_url, {method:'PUT', headers:{'Content-Type':'image/jpeg'}, body:blob});
    return r.ok ? d.path : null;
  }catch(e){ return null; }
}
const PHOTO_FILES = {};   // id -> File[]
function photoBox(id,label){
  PHOTO_FILES[id] = [];
  return '<label class="photo" id="'+id+'box"><span id="'+id+'txt">📷 '+label+' (you can pick several)</span>'+
         '<input type="file" accept="image/*" multiple id="'+id+'"></label>';
}
function wirePhoto(id){
  const el = $(id); if(!el) return;
  el.onchange = () => {
    PHOTO_FILES[id] = [...(PHOTO_FILES[id]||[]), ...Array.from(el.files||[])];
    el.value = '';  // cleared so picking again appends rather than replacing
    const n = PHOTO_FILES[id].length;
    if(n){ $(id+'txt').textContent = '✓ '+n+' photo'+(n===1?'':'s')+' attached — tap to add more'; $(id+'box').classList.add('has'); }
  };
}
async function uploadAllPhotos(id, kind){
  const files = PHOTO_FILES[id] || [];
  const paths = []; let failed = 0;
  for(const f of files){
    const p = await uploadPhoto(f, kind);
    if(p) paths.push(p); else failed++;
  }
  return {paths, failed};
}

        '<button data-yes="'+r.id+'" style="background:var(--navy);color:#fff">Approve</button>'+
      '</div></div>';
  }).join('');
  const decide = async (id, decision) => {
    const r = await call({action:'decide', approval_id:id, decision});
    if(!r.ok) return alert(r.error);
    loadApprovals();
  };
  $('res').querySelectorAll('[data-yes]').forEach(b => b.onclick = () => decide(b.dataset.yes,'APPROVED'));
  $('res').querySelectorAll('[data-no]').forEach(b => b.onclick = () => decide(b.dataset.no,'REJECTED'));
}

/* ================= DATA EDITOR (Admin + Inventory) ================= */
let GRID_FILTER = 'ALL', GRID_Q = '', GRID_OFFSET = 0, GRID_LIMIT = 1000, GRID_COUNTS = {};
const FILTERS = [['ALL','All'],['LIVE','Live'],['NOT_LIVE','Not live'],['PENDING','Pending'],['DUPLICATES','Duplicates']];

async function loadGrid(reset){
  if(reset){ GRID_OFFSET = 0; }
  $('res').innerHTML = '<div class="msg">Loading…</div>';
  const d = await call({action:'grid', filter:GRID_FILTER, query:GRID_Q||null, limit:GRID_LIMIT, offset:GRID_OFFSET});
  if(!d.ok) return $('res').innerHTML = '<div class="msg">'+esc(d.error)+'</div>';
  GRID_COUNTS = d.counts;
  renderGrid(d);
}

function renderGrid(d){
  let h = '<div class="chips">'+FILTERS.map(([k,label]) =>
    '<button class="chip'+(GRID_FILTER===k?' on':'')+'" data-f="'+k+'">'+label+' <b>'+(GRID_COUNTS[k]??0)+'</b></button>').join('')+'</div>';

  h += '<div class="searchbar" style="margin-bottom:12px"><input id="eq" placeholder="Search code, name, brand, location" value="'+esc(GRID_Q)+'"><button id="egoBtn">Go</button></div>';

  h += '<div class="gridtools"><button id="addRowBtn">+ Add stock</button>'+
    (ROLE==='ADMIN' ? '<button id="bulkBtn">+ Bulk upload</button>' : '')+'</div>';

  if(!d.rows.length){
    h += '<div class="msg">No rows match this filter.</div>';
  } else {
    h += d.rows.map(r => {
      const tags = [];
      if(r.row_status==='NOT_LIVE' || !r.is_active) tags.push('<span class="tag notlive">NOT LIVE</span>');
      if(r.pending_edit) tags.push('<span class="tag pending">PENDING EDIT</span>');
      const activePartners = (r.dup_partners||[]).filter(p => p.decision !== 'DISMISSED');
      if(activePartners.length) tags.push('<span class="tag dup">'+activePartners.length+' possible match'+(activePartners.length===1?'':'es')+'</span>');
      return '<div class="grow" data-row=\''+JSON.stringify(r).replace(/'/g,'&#39;')+'\'>'+
        '<div class="gh">'+
          '<div class="gt" data-open="1">'+
            '<b>'+esc(r.model_code)+'</b>'+
            '<span>'+[esc(r.location_name), r.brand, r.size].filter(Boolean).join(' · ')+'</span>'+
          '</div>'+
          '<div class="step">'+
            '<button data-step="-1">−</button>'+
            '<input type="number" data-qty value="'+r.current_physical_qty+'">'+
            '<button data-step="1">+</button>'+
            '<button data-save class="hide" style="background:var(--navy);color:#fff">✓</button>'+
          '</div>'+
        '</div>'+
        (tags.length ? '<div class="tagrow">'+tags.join('')+'</div>' : '')+
        (activePartners.length ? '<div class="duppanel">'+
          (activePartners.length>1 ? '<div class="dupnote">'+esc(r.model_code)+' was matched against '+activePartners.length+' other tiles — each needs its own decision below.</div>' : '')+
          activePartners.map(p =>
          '<div class="dupline">'+
            '<div class="dt"><b>vs '+esc(p.model_code)+'</b>'+
            '<span>'+[p.brand, p.size].filter(Boolean).map(esc).join(' · ')+
            (p.brand||p.size?' · ':'')+esc((p.kind||'').replace(/_/g,' ').toLowerCase())+
            (p.note?' — '+esc(p.note):'')+'</span></div>'+
            (ROLE==='ADMIN' ? '<div class="dupacts">'+
              '<button class="dupno" data-dis="'+esc(r.model_id)+'|'+esc(p.model_id)+'|'+esc(p.kind)+'">Not a duplicate</button>'+
              '<button class="dupyes" data-merge="'+esc(r.model_id)+'|'+esc(p.model_id)+'|'+esc(p.kind)+'" data-keep="'+esc(r.model_code)+'" data-lose="'+esc(p.model_code)+'">Keep '+esc(r.model_code)+'</button>'+
              '<button class="dupyes" data-merge="'+esc(p.model_id)+'|'+esc(r.model_id)+'|'+esc(p.kind)+'" data-keep="'+esc(p.model_code)+'" data-lose="'+esc(r.model_code)+'">Keep '+esc(p.model_code)+'</button>'+
            '</div>' : '')+'</div>').join('')+'</div>' : '')+
      '</div>';
    }).join('');
    if(d.rows.length + GRID_OFFSET < d.total)
      h += '<button class="more" id="loadMoreBtn">Load more ('+(d.total - GRID_OFFSET - d.rows.length)+' left)</button>';
  }
  $('res').innerHTML = h;
  wireGrid();
}

function wireGrid(){
  $('res').querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    GRID_FILTER = b.dataset.f; loadGrid(true);
  });
  $('egoBtn').onclick = () => { GRID_Q = $('eq').value.trim(); loadGrid(true); };
  $('eq').addEventListener('keydown', e => { if(e.key==='Enter') $('egoBtn').click(); });
  $('addRowBtn').onclick = openAddRow;
  const bb = $('bulkBtn'); if(bb) bb.onclick = openBulkUpload;
  const lm = $('loadMoreBtn');
  if(lm) lm.onclick = async () => {
    GRID_OFFSET += GRID_LIMIT;
    const d = await call({action:'grid', filter:GRID_FILTER, query:GRID_Q||null, limit:GRID_LIMIT, offset:GRID_OFFSET});
    if(!d.ok) return;
    GRID_COUNTS = d.counts; renderGrid({...d, rows: [...currentRows(), ...d.rows]});
  };

  $('res').querySelectorAll('.grow').forEach(el => {
    const row = JSON.parse(el.dataset.row);
    el.querySelector('[data-open]').onclick = () => openRowEditor(row);
    const inp = el.querySelector('[data-qty]');
    const saveBtn = el.querySelector('[data-save]');
    const toggleSave = () => saveBtn.classList.toggle('hide', Number(inp.value||0) === row.current_physical_qty);
    el.querySelectorAll('[data-step]').forEach(btn => btn.onclick = () => {
      inp.value = Math.max(0, Number(inp.value||0) + Number(btn.dataset.step));
      toggleSave();
    });
    inp.addEventListener('input', toggleSave);
    saveBtn.onclick = () => submitQtyChange(row, Number(inp.value||0));
  });

  $('res').querySelectorAll('[data-dis]').forEach(btn => btn.onclick = () => decideDup(btn.dataset.dis, 'DISMISSED', btn));
  $('res').querySelectorAll('[data-merge]').forEach(btn => btn.onclick = () => mergeDup(btn, btn.dataset.keep, btn.dataset.lose));
}

async function decideDup(key, decision, btn){
  const [modelA, modelB, kind] = key.split('|');
  btn.disabled = true;
  const r = await call({action:'decide_duplicate', model_a:modelA, model_b:modelB, kind, decision});
  if(!r.ok){ btn.disabled=false; alert(r.error); return; }
  loadGrid(true);
}

async function mergeDup(btn, keepCode, loseCode){
  if(!confirm('Keep "'+keepCode+'" and move all of "'+loseCode+'"\'s stock into it?\n\n"'+loseCode+'" will be retired — its boxes get added to '+keepCode+', and searching '+loseCode+' will still find '+keepCode+'. This cannot be undone from here.')) return;
  const [keeper, loser, kind] = btn.dataset.merge.split('|');
  btn.disabled = true; btn.textContent = 'Merging…';
  const r = await call({action:'merge_duplicate', keeper_id:keeper, loser_id:loser, kind});
  if(!r.ok){ btn.disabled=false; btn.textContent='Keep '+keepCode; alert(r.error); return; }
  alert('Done. '+r.combined+' shelf'+(r.combined===1?'':'s')+' combined, '+r.reassigned+' handed over to '+r.keeper_code+'.');
  loadGrid(true);
}
function currentRows(){
  return Array.from($('res').querySelectorAll('.grow')).map(el => JSON.parse(el.dataset.row));
}

async function submitQtyChange(row, newQty){
  if(newQty === row.current_physical_qty) return;
  const d = await call({action:'request_edit', type:'EDIT_ROW',
    payload:{ stock_id:row.stock_id, row_version:row.row_version, changes:{ qty:newQty } },
    reason:'Data editor: quantity correction', idempotency: uid()});
  if(!d.ok){ alert(d.error); loadGrid(true); return; }
  loadGrid(true);
}

function openRowEditor(row){
  openSheet('<h3>'+esc(row.model_code)+'</h3><div class="sub">'+esc(row.location_name)+'</div>'+
    '<div id="sherr" class="serr hide"></div>'+
    '<span class="shared-lbl">Shared across all locations of this tile</span>'+
    '<div class="field shared"><label>Code</label><input id="fCode" value="'+esc(row.model_code||'')+'"></div>'+
    '<div class="row2"><div class="field shared"><label>Name</label><input id="fName" value="'+esc(row.model_name||'')+'"></div>'+
    '<div class="field shared"><label>Brand</label><input id="fBrand" value="'+esc(row.brand||'')+'"></div></div>'+
    '<div class="row2"><div class="field shared"><label>Size</label><input id="fSize" value="'+esc(row.size||'')+'"></div>'+
    '<div class="field shared"><label>Category</label><input id="fCat" value="'+esc(row.category||'')+'"></div></div>'+
    '<div class="field" style="margin-top:6px"><label>Boxes at this location</label><input id="fQty" type="number" value="'+row.current_physical_qty+'"></div>'+
    '<div class="field"><label>Status</label><select id="fStatus">'+
      '<option value="LIVE"'+(row.row_status==='LIVE'?' selected':'')+'>Live</option>'+
      '<option value="NOT_LIVE"'+(row.row_status==='NOT_LIVE'?' selected':'')+'>Not live</option>'+
    '</select></div>'+
    '<button class="go" id="okEdit">Save changes</button>'+
    '<button class="more danger" id="okDelete" style="margin-top:10px">Remove this row</button>'+
    '<button class="cancel" onclick="closeSheet()">Cancel</button>');

  $('okEdit').onclick = async () => {
    $('okEdit').disabled = true; $('okEdit').textContent = 'Saving…';
    const newCode = $('fCode').value.trim();
    if(!newCode) { $('okEdit').disabled=false; $('okEdit').textContent='Save changes'; return sErr('Code cannot be empty'); }
    const modelChanges = {};
    if(newCode !== row.model_code) modelChanges.model_code = newCode;
    if($('fName').value.trim() !== (row.model_name||'')) modelChanges.model_name = $('fName').value.trim();
    if($('fBrand').value.trim() !== (row.brand||'')) modelChanges.brand = $('fBrand').value.trim();
    if($('fSize').value.trim() !== (row.size||'')) modelChanges.size = $('fSize').value.trim();
    if($('fCat').value.trim() !== (row.category||'')) modelChanges.category = $('fCat').value.trim();

    const stockChanges = {};
    const newQty = Number($('fQty').value||0);
    if(newQty !== row.current_physical_qty) stockChanges.qty = newQty;
    if($('fStatus').value !== row.row_status) stockChanges.row_status = $('fStatus').value;

    let lastErr = null, anyPending = false;
    if(Object.keys(modelChanges).length){
      const r1 = await call({action:'request_edit', type:'EDIT_MODEL',
        payload:{model_id:row.model_id, changes:modelChanges}, reason:'Data editor', idempotency:uid()});
      if(!r1.ok) lastErr = r1.error; else if(r1.status==='PENDING') anyPending = true;
    }
    if(!lastErr && Object.keys(stockChanges).length){
      const r2 = await call({action:'request_edit', type:'EDIT_ROW',
        payload:{stock_id:row.stock_id, row_version:row.row_version, changes:stockChanges},
        reason:'Data editor', idempotency:uid()});
      if(!r2.ok) lastErr = r2.error; else if(r2.status==='PENDING') anyPending = true;
    }
    if(lastErr){ $('okEdit').disabled=false; $('okEdit').textContent='Save changes'; return sErr(lastErr); }
    closeSheet();
    if(anyPending) alert('Sent for approval — nothing changes until Admin approves it.');
    loadGrid(true);
  };

  $('okDelete').onclick = async () => {
    const force = row.current_physical_qty > 0
      ? confirm('This row still shows '+row.current_physical_qty+' boxes. Remove it anyway?')
      : true;
    if(row.current_physical_qty > 0 && !force) return;
    const d = await call({action:'request_edit', type:'DELETE_ROW',
      payload:{stock_id:row.stock_id, force}, reason:'Data editor: row removed', idempotency:uid()});
    if(!d.ok) return sErr(d.error);
    closeSheet();
    if(d.status==='PENDING') alert('Sent for approval — nothing changes until Admin approves it.');
    loadGrid(true);
  };
}

$('doXfer').onclick = async () => {

    '<div class="field" style="margin-top:14px"><label>Reason</label><textarea id="xrsn" placeholder="e.g. Balancing stock ahead of the weekend"></textarea></div>'+
    '<button class="go" id="okXfer">Send for approval</button>'+

    const c = CART[+inp.dataset.i];

      '<button class="go" onclick="closeSheet();CART=[];paintCart();search()">Done</button>');
  };
};

/* ================= BULK UPLOAD (Admin only) ================= */
let BULK_FILE_NAME = null, BULK_HEADERS = [], BULK_DATA = [], BULK_BATCH = null;

function openBulkUpload(){
  openSheet('<h3>Bulk Upload</h3><div class="sub">Upload an Excel or CSV file. Nothing touches live stock until you review and commit it.</div>'+
    '<div id="sherr" class="serr hide"></div>'+
    '<input type="file" id="bulkFile" accept=".xlsx,.xls,.csv" style="margin:14px 0;width:100%">'+
    '<div id="bulkMapArea"></div>'+
    '<button class="cancel" onclick="closeSheet()">Cancel</button>');

  $('bulkFile').onchange = async () => {
    const f = $('bulkFile').files[0]; if(!f) return;
    if(typeof XLSX === 'undefined') return sErr('Could not load the file reader — check your connection and try again.');
    try{
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows2d = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if(!rows2d.length) return sErr('That file has no rows');
      BULK_HEADERS = rows2d[0].map(h => String(h||'').trim());
      BULK_DATA = rows2d.slice(1).filter(r => r.some(c => String(c||'').trim() !== ''));
      BULK_FILE_NAME = f.name;
      if(!BULK_DATA.length) return sErr('No data rows found below the header row');
      renderBulkMapping();
    }catch(e){ sErr('Could not read that file — is it a valid Excel or CSV file?'); }
  };
}

function guessCol(headers, keywords){
  const lower = headers.map(h => h.toLowerCase());
  for(const kw of keywords){ const i = lower.findIndex(h => h.includes(kw)); if(i>=0) return i; }
  return -1;
}

function renderBulkMapping(){
  const fields = [
    ['model_code','Tile Code *',['code','model','sku','item']],
    ['model_name','Name',['name','description','desc']],
    ['brand','Brand',['brand','make']],
    ['size','Size',['size','dimension']],
    ['category','Category',['category','type']],
    ['location_name','Location *',['location','shelf','rack','godown','stand']],
    ['qty','Quantity *',['qty','quantity','boxes','count','stock']],
  ];
  let h = '<div class="field" style="margin-top:10px"><label>Match your columns</label></div>';
  fields.forEach(([key,label,kws]) => {
    const guess = guessCol(BULK_HEADERS, kws);
    h += '<div class="row2" style="align-items:center;margin-bottom:8px">'+
      '<div style="flex:0 0 38%;font-size:13px;font-weight:600">'+esc(label)+'</div>'+
      '<select data-map="'+key+'" style="flex:1"><option value="">— skip —</option>'+
      BULK_HEADERS.map((hd,i) => '<option value="'+i+'"'+(i===guess?' selected':'')+'>'+esc(hd||('Column '+(i+1)))+'</option>').join('')+
      '</select></div>';
  });
  h += '<div class="meta">'+BULK_DATA.length+' data rows found in "'+esc(BULK_FILE_NAME)+'"</div>';
  h += '<button class="go" id="bulkPreviewBtn" style="margin-top:14px">Stage for review</button>';
  $('bulkMapArea').innerHTML = h;
  $('bulkPreviewBtn').onclick = doBulkStage;
}

async function doBulkStage(){
  const map = {};
  $('sheet').querySelectorAll('[data-map]').forEach(s => { map[s.dataset.map] = s.value; });
  if(map.model_code === '') return sErr('Pick a column for Tile Code');
  if(map.location_name === '') return sErr('Pick a column for Location');
  if(map.qty === '') return sErr('Pick a column for Quantity');

  $('bulkPreviewBtn').disabled = true; $('bulkPreviewBtn').textContent = 'Processing…';
  const pick = (r,k) => map[k] !== '' && map[k] != null ? String(r[map[k]] ?? '').trim() : '';
  const rows = BULK_DATA.map(r => ({
    model_code: pick(r,'model_code'), model_name: pick(r,'model_name'), brand: pick(r,'brand'),
    size: pick(r,'size'), category: pick(r,'category'), location_name: pick(r,'location_name'), qty: pick(r,'qty'),
  }));

  const d = await call({action:'bulk_stage', filename:BULK_FILE_NAME, rows});
  if(!d.ok){ sErr(d.error); $('bulkPreviewBtn').disabled=false; $('bulkPreviewBtn').textContent='Stage for review'; return; }
  BULK_BATCH = d.batch_id;
  closeSheet();
  renderBulkPreview();
}

async function renderBulkPreview(){
  $('res').innerHTML = '<div class="msg">Loading…</div>';
  const pv = await call({action:'bulk_preview', batch_id:BULK_BATCH});
  if(!pv.ok) return $('res').innerHTML = '<div class="msg">'+esc(pv.error)+'</div>';
  const rows = pv.rows;
  const ready = rows.filter(r => r.status==='READY').length;
  const err = rows.filter(r => r.status==='ERROR').length;
  const done = rows.filter(r => r.status==='COMMITTED').length;

  let h = '<div class="msg" style="text-align:left"><b>'+esc(pv.batch.filename||'Upload')+'</b><br>'+
    (done ? done+' already committed. ' : '')+ready+' ready to import, '+err+' with problems.</div>';

  h += rows.filter(r => r.status !== 'COMMITTED').map(r =>
    '<div class="grow"><div class="gh"><div class="gt"><b>'+esc(r.model_code||'—')+'</b>'+
    '<span>'+[esc(r.location_name||''), r.qty!=null?r.qty+' boxes':null].filter(Boolean).join(' · ')+'</span></div>'+
    '<span class="tag '+(r.status==='ERROR'?'notlive':'pending')+'">'+(r.status==='ERROR'?esc(r.error_msg):'READY')+'</span></div>'+
    (r.status==='ERROR' ? '<div class="tagrow"><button class="dupno" data-drop="'+r.id+'">Remove this row</button></div>' : '')+
    '</div>').join('');

  h += '<div class="gridtools" style="margin-top:14px">'+
    (ROLE==='ADMIN' && ready>0 ? '<button id="bulkCommitBtn">Commit '+ready+' rows</button>' : '')+
    '<button id="bulkCancelBtn" style="border-color:#f3c9c5;color:#b3261e">Back to editor</button></div>';
  $('res').innerHTML = h;

  $('res').querySelectorAll('[data-drop]').forEach(b => b.onclick = async () => {
    await call({action:'bulk_drop_row', row_id:b.dataset.drop});
    renderBulkPreview();
  });
  const commitBtn = $('bulkCommitBtn');
  if(commitBtn) commitBtn.onclick = async () => {
    if(!confirm('Commit '+ready+' rows to live stock? This adds to existing tiles and creates new ones as needed.')) return;
    commitBtn.disabled = true; commitBtn.textContent = 'Committing…';
    const cd = await call({action:'bulk_commit', batch_id:BULK_BATCH});
    if(!cd.ok){ alert(cd.error); commitBtn.disabled=false; commitBtn.textContent='Commit '+ready+' rows'; return; }
    alert(cd.committed+' row'+(cd.committed===1?'':'s')+' committed'+
      (cd.failed?', '+cd.failed+' failed unexpectedly — check the audit log':'')+'.');
    BULK_BATCH = null;
    loadGrid(true);
  };
  $('bulkCancelBtn').onclick = () => { BULK_BATCH = null; loadGrid(true); };
}

/* ================= NAVIGATION ================= */
let LAST = null;              // last search term, for the back button
function goHome(){
  CART = []; paintCart(); closeSheet();
  $('q').value = ''; LAST = null;
  setTab('stock');
  $('back').classList.add('hide');
}
$('whoBtn').onclick = goHome;
$('back').onclick = () => {
  if($('ov').classList.contains('hide') === false){ closeSheet(); return; }
  if(LAST){ LAST = null; $('q').value=''; setTab('stock'); $('back').classList.add('hide'); }
  else goHome();
};

window.addEventListener('popstate', () => { if(!$('ov').classList.contains('hide')) closeSheet(); });
if(TOKEN && NAME) enter();
</script>
