  <script>
  // NUCLEAR CACHE CLEAR — runs before anything else
  (async function() {
    try {
      // Kill all service workers
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      // Clear ALL caches
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    } catch(e) {}
  })();
</script>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0F172A;color:#E2E8F0;font-family:'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
:root{

/* LAYOUT */
.layout{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:var(--nav-w);background:#0A1628;border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:50}

.sb-logo-box{width:36px;height:36px;background:var(--bdk);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0}
.sb-logo-text{font-size:14px;font-weight:900;color:var(--t1)}
.sb-logo-sub{font-size:9px;color:var(--t3)}
.sb-nav{flex:1;padding:12px 8px;overflow-y:auto}
.sb-section{font-size:9px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 4px;margin-top:4px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;margin-bottom:1px}
.sb-item:hover{background:var(--card);color:var(--t1)}
.sb-item.active{background:var(--blt);color:var(--b);font-weight:800}
.sb-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}
.sb-footer{padding:12px;border-top:1px solid var(--bdr)}
.sb-user{font-size:11px;color:var(--t3);margin-bottom:8px}
.sb-user strong{color:var(--t1);display:block;font-size:13px}

/* MAIN */
.main{margin-left:var(--nav-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#0A1628;border-bottom:1px solid var(--bdr);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:40}
.topbar-title{font-size:16px;font-weight:900;color:var(--t1)}
.topbar-acts{display:flex;gap:8px;align-items:center}
.content{padding:20px;flex:1}

/* CARDS */
.card{background:var(--card);border-radius:14px;border:1px solid var(--bdr);padding:16px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:800;color:var(--t1);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat-card{background:var(--card);border-radius:12px;border:1px solid var(--bdr);padding:14px}
.stat-val{font-size:24px;font-weight:900;color:var(--t1)}
.stat-lbl{font-size:11px;color:var(--t3);margin-top:4px;font-weight:600}
.stat-change{font-size:10px;font-weight:700;margin-top:4px}
.stat-up{color:var(--green)}
.stat-dn{color:var(--red)}

/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:1px solid var(--bdr);text-align:left;white-space:nowrap}
.tbl td{padding:10px 12px;font-size:13px;color:var(--t2);border-bottom:1px solid var(--bdr)}
.tbl tr:hover td{background:var(--card2)}

.form-inp{width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;font-size:13px;color:var(--t1);font-family:inherit;outline:none}

/* BUTTONS */

.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:none;border:1px solid var(--bdr);color:var(--t2)}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}

/* TOAST */

.toast-msg{background:#1E293B;color:#F1F5F9;border:1px solid var(--bdr);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;animation:ti .25s ease;min-width:200px}
@keyframes ti{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

<script>
const SB_URL = 'https://ndamdnlsuktucqtcbhgp.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kYW1kbmxzdWt0dWNxdGNiaGdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0MTg1MzgsImV4cCI6MjA5Njk5NDUzOH0.7pGJu4bbNhl4E-4Do24jS9_p6nLUa1eN4JXQSqEF9VU';

let _adminSession = null;
let _adminProfile = null;
let _currentPage = 'dashboard';

// ── HELPERS ──
async function sbFetch(path, opts={}) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':`Bearer ${_adminSession?.access_token||ANON}`,...(opts.headers||{})},
    ...opts
  });
  if (!r.ok) { const e = await r.text(); throw new Error(e); }
  return r.json().catch(()=>null);
}

async function proFn(body) {
  const r = await fetch(`${SB_URL}/functions/v1/professional-api`, {
    method:'POST', headers:{'Content-Type':'application/json','apikey':ANON,'x-admin-token':_adminSession?.access_token||''},
    body:JSON.stringify(body)
  });
  return r.json();
}

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = 'toast-msg';
  el.style.borderLeft = `3px solid ${type==='ok'?'#22C55E':type==='err'?'#EF4444':'#3B82F6'}`;
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},3000);
}

function openModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

function setPageTitle(t) { document.getElementById('page-title').textContent = t; document.getElementById('topbar-time').textContent = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }

function setNav(page) {
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  document.getElementById(`nav-${page}`)?.classList.add('active');
}

// ── AUTH ──
async function adminLogin() {
  const phone = document.getElementById('admin-phone').value.trim();
  const pin = document.getElementById('admin-pin').value.trim();
  if (!phone||phone.length<10) { showLoginErr('Enter valid mobile'); return; }
  if (!pin||pin.length<6) { showLoginErr('Enter 6-digit PIN'); return; }
  const btn = document.getElementById('admin-login-btn');
  btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
      method:'POST', headers:{'Content-Type':'application/json','apikey':ANON},
      body:JSON.stringify({email:phone+'@vwholesale.app', password:pin})
    });
    const data = await res.json();
    if (data.error||!data.access_token) throw new Error(data.error_description||data.error||'Wrong PIN or not registered');

    // Store session immediately so sbFetch uses authenticated token
    _adminSession = data;
    const uid = data.user?.id;

    // Try lookup by user ID first (most reliable, uses JWT auth)
    let profile = uid ? await sbFetch(`profiles?id=eq.${uid}&select=id,name,role,status`).then(d=>d?.[0]).catch(()=>null) : null;

    // Fallback: lookup by phone
    if (!profile) {
      profile = await sbFetch(`profiles?phone=eq.${phone}&select=id,name,role,status`).then(d=>d?.[0]).catch(()=>null);
    }

    // Fallback: use data from JWT user metadata
    if (!profile && data.user) {
      profile = {
        id: uid,
        name: data.user.user_metadata?.name || 'Admin',
        phone: phone,
        role: data.user.user_metadata?.role || 'admin',
        status: 'approved'
      };
    }

    if (!profile) throw new Error('Profile not found. Contact store admin.');
    if (!['admin','manager','owner','staff','executive'].includes(profile.role)) {
      throw new Error(`Access denied. Your role is "${profile.role}". Admin access required.`);
    }

    _adminProfile = profile;
    localStorage.setItem('vw_admin_session', JSON.stringify(data));
    localStorage.setItem('vw_admin_profile', JSON.stringify(profile));
    startAdminApp();
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Login to Admin';
    showLoginErr(e.message);
  }
}

function showLoginErr(msg) { const el = document.getElementById('admin-login-err'); el.textContent = msg; el.style.display = 'block'; }

function adminLogout() {
  if (!confirm('Log out of Admin?')) return;
  localStorage.removeItem('vw_admin_session');
  localStorage.removeItem('vw_admin_profile');
  location.reload();
}

function startAdminApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('admin-app').style.display = 'flex';
  document.getElementById('admin-name').textContent = _adminProfile.name||'Admin';
  document.getElementById('admin-role').textContent = _adminProfile.role;
  loadPage('dashboard');
}

// ── PAGES ──
async function loadPage(page) {
  _currentPage = page;
  setNav(page);
  const content = document.getElementById('page-content');
  content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--t3)">Loading…</div>';
  document.getElementById('sidebar').classList.remove('open');
  const pages = {dashboard:loadDashboard, orders:loadOrders, customers:loadCustomers, professionals:loadProfessionals, briefs:loadBriefs, products:loadProducts, categories:loadCategories, catalog:loadCatalog, promos:loadPromos, staff:loadStaff, settings:loadSettings, import:loadImport, analytics:loadAnalytics, accounts:loadAccounts, gst:loadGST, eod:loadEOD, hr:loadHR, vendors:loadVendors, commissions:loadCommissions, referrals:loadReferrals, marketing:loadMarketing, field:loadFieldMap, fieldteam:loadFieldTeam, fieldvisits:loadFieldVisits, fieldfuel:loadFieldFuel, fieldincentives:loadFieldIncentives, orgchart:loadOrgChart, territories:loadTerritories};
  if (pages[page]) await pages[page]();
}

// ── DASHBOARD ──
// ══════════ DATA IMPORT (AlignBooks) ══════════
// One-time-ish load of the AlignBooks exports until billing moves to the Staff
// Portal on 1 Sept. Admin-only: it upserts 1,693 customers and reloads ~19,700
// invoice lines, so it is not something a marketer should be able to fire.
let _impCust = null, _impSales = null;

async function loadImport() {
  setPageTitle('Data Import');
  const c = document.getElementById('page-content');
  c.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:14px;font-weight:700;margin-bottom:6px">AlignBooks Import</div>
      <div style="font-size:12px;color:var(--t3);line-height:1.7">
        Upload the two AlignBooks exports. Customers land in the existing customer table
        (matched on AlignBooks code, so re-running is safe and does not duplicate).
        Invoice lines are fully replaced each run.<br>
        Category is derived from the HSN code, brand from the item name, and each customer's
        construction stage from the furthest category they have reached.
      </div>

let _impFVRows = [];

function impFieldVisitRead(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const info = document.getElementById('imp-fv-info');
  info.textContent = 'Reading…';
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!rows.length) { info.textContent = 'No rows found'; return; }
      const STAGE_MAP = {
        'Just Started Pillars':'structure','Basement Completed':'structure',
        'Brick Walls Completed':'plumbing_roughin','Slabs Completed':'plumbing_roughin',
        'Wiring & Plumbing Completed':'flooring',
        'Tiles/Marbles/Flooring Completed':'bathroom','Almost all completed':'painting'
      };
      const VP = /^[6-9][0-9]{9}$/;
      _impFVRows = rows.map(r => {
        const rawP = String(r['Contact Number 1']||'').trim().replace(/\D/g,'').slice(-10);
        const phone = VP.test(rawP) ? rawP : null;
        const stageRaw = String(r['Project Feedback']||'').trim();
        const reqRaw = String(r['Client Requirement ']||r['Client Requirement']||'').trim();
        const reqs = reqRaw ? reqRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
        let visitedAt=null, visitDate=null;
        try { if(r['Timestamp']) visitedAt=new Date(r['Timestamp']).toISOString(); } catch{}
        try { const d=r['DATE']||r['Date']; if(d) visitDate=new Date(d).toISOString().split('T')[0]; } catch{}
        return {
          visited_at:visitedAt, visit_date:visitDate,
          area_name:String(r['Area Name']||'').trim()||null,
          contact_name:String(r['Contact Name 1']||'').trim()||null,
          contact_phone:phone,
          profession:String(r['Profession']||'').trim()||null,
          person_onsite:String(r['Person Onsite/Offsite']||'').toLowerCase().includes('on site'),
          project_type:String(r['Project Details']||'').trim()||null,
          requirements_raw:reqRaw||null,
          requirements:reqs.length?reqs:null,
          construction_stage:STAGE_MAP[stageRaw]||null, stage_raw:stageRaw||null,
          visited_by_name:String(r['Visit done by:']||'').trim()||null,
          visited_by_email:String(r['Email Address']||'').trim()||null,
          project_name:String(r['Name of the Company, Project or Office']||'').trim()||null,
          city:String(r['Select City']||'Vijayawada').trim()||'Vijayawada',
          maps_url:String(r['Project Location Link']||'').trim()||null,
          comments:String(r['Comments ']||r['Comments']||'').trim()||null,
          raw:JSON.stringify(r)
        };
      }).filter(r=>r.visited_at||r.visit_date);
      const valid=_impFVRows.filter(r=>r.contact_phone).length;
      const withStage=_impFVRows.filter(r=>r.construction_stage).length;
      info.innerHTML=`<b>${_impFVRows.length}</b> rows · <b>${valid}</b> valid phones · <b>${withStage}</b> stage mapped`;
      document.getElementById('imp-fv-go').disabled=false;
    } catch(err) { info.innerHTML=`<span style="color:#ef4444">Error: ${err.message}</span>`; }
  };
  reader.readAsArrayBuffer(f);
}

async function impFieldVisitRun() {
  const btn=document.getElementById('imp-fv-go');
  const log=document.getElementById('imp-fv-log');
  btn.disabled=true; btn.textContent='Importing…'; log.innerHTML='';
  const H={'Content-Type':'application/json','apikey':ANON,'Authorization':`Bearer ${_adminSession?.access_token||ANON}`};
  const fvLog=(msg,col)=>{ log.innerHTML+=`<div style="color:${col||'var(--t3)'}">${msg}</div>`; log.scrollTop=log.scrollHeight; };
  try {
    fvLog('Loading customer phones…');
    // Use anon key only — avoids expired session JWT issue
    const anonH={'apikey':ANON,'Authorization':'Bearer '+ANON};
    const cpRes=await fetch(`${SB_URL}/rest/v1/customers?select=id,phone&phone=not.is.null&limit=2000`,{headers:anonH});
    const cpBody=await cpRes.json();
    if(!cpRes.ok) throw new Error('Customer fetch: '+JSON.stringify(cpBody).slice(0,120));
    const cp=Array.isArray(cpBody)?cpBody:[];
    const pm={};
    for(const c of cp) if(c.phone) pm[c.phone.replace(/\D/g,'').slice(-10)]=c.id;
    fvLog(`${Object.keys(pm).length} customers loaded`);

    let inserted=0,skipped=0;
    const linked=_impFVRows.map(r=>({...r,customer_id:r.contact_phone?(pm[r.contact_phone]||null):null}));
    const BATCH=200;
    for(let i=0;i<linked.length;i+=BATCH){
      const batch=linked.slice(i,i+BATCH);
      const res=await fetch(`${SB_URL}/rest/v1/field_visits_import`,{
        method:'POST',
        headers:{...anonH,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify(batch)
      });
      if(!res.ok){
        const err=await res.text();
        skipped+=batch.length;
        fvLog(`Batch ${Math.floor(i/BATCH)+1} error: ${err.slice(0,120)}`,'#f59e0b');
      } else inserted+=batch.length;
      btn.textContent=`Importing… ${inserted+skipped}/${linked.length}`;
    }
    const linkedCount=linked.filter(r=>r.customer_id).length;
    fvLog(`✅ Done — ${inserted} imported · ${linkedCount} linked to customers · ${skipped} skipped`,'#22c55e');
    btn.textContent='✅ Complete';
  } catch(err){
    fvLog('❌ '+err.message,'#ef4444');
    btn.disabled=false; btn.textContent='Import Field Visits';
  }
}

function impLog(msg, kind) {
  const el = document.getElementById('imp-log');
  if (!el) return;
  const col = kind === 'err' ? '#ef4444' : kind === 'ok' ? '#22c55e' : 'var(--t3)';
  el.innerHTML += `<div style="color:${col}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// AlignBooks export quirks this has to survive:
//  - company letterhead occupies the first rows, real header is ~row 4
//  - a blank "Zoom" column sits at index 0, so the first cell of a data row is
//    empty and must NOT be treated as an empty row (this bit me: every customer
//    row was being skipped)
//  - "Under Ledger:" group headings are repeated inside the data
//  - column names repeat ("Customer" appears twice in the sales register)
function impSheet(file, cb) {
  const fr = new FileReader();
  fr.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const grid = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });

      let hdr = -1;
      for (let i = 0; i < Math.min(15, grid.length); i++) {
        const row = (grid[i] || []).map(x => String(x || '').trim());
        if (row.indexOf('Customer') >= 0) { hdr = i; break; }
      }
      if (hdr < 0) { cb(null, 'Could not find a header row containing "Customer"'); return; }

      // De-duplicate repeated headers the way pandas does: Customer, Customer.1
      const seen = {};
      const cols = (grid[hdr] || []).map(x => {
        let c = String(x || '').trim();
        if (!c) return '';
        if (seen[c] === undefined) { seen[c] = 0; return c; }
        seen[c]++; return c + '.' + seen[c];
      });

      const rows = [];
      for (let i = hdr + 1; i < grid.length; i++) {
        const r = grid[i];
        if (!r || !r.length) continue;
        // judge emptiness on the WHOLE row, not cell 0
        const joined = r.map(x => String(x || '').trim()).join('');
        if (!joined) continue;
        if (joined.replace(/\s/g, '').indexOf('UnderLedger') === 0) continue;
        const o = {};
        cols.forEach((c, j) => { if (c) o[c] = r[j]; });
        rows.push(o);
      }
      cb({ cols: cols.filter(Boolean), rows, hdr }, null);
    } catch (err) {
      cb(null, 'Could not read the file: ' + err.message);
    }
  };
  fr.readAsArrayBuffer(file);
}

function impRead(input, which) {
  const f = input.files && input.files[0];
  if (!f) return;
  const info = document.getElementById('imp-' + which + '-info');
  info.textContent = 'Reading…';
  impSheet(f, (data, err) => {
    if (err) { info.innerHTML = `<span style="color:#ef4444">${err}</span>`; return; }
    if (which === 'cust') {
      _impCust = data.rows;
      const withPhone = data.rows.filter(r => {
        const d = String(r['Phone'] ?? '').replace(/\D/g, '');
        const l = d.length > 10 ? d.slice(-10) : d;
        return l.length === 10 && '6789'.includes(l[0]);
      }).length;
      const gst = data.rows.filter(r => r['GST']).length;
      info.innerHTML = `<b>${data.rows.length}</b> customers · <b>${withPhone}</b> with mobile ·
        <b>${data.rows.length - withPhone}</b> without · <b>${gst}</b> B2B (GST)
        <div style="margin-top:6px;font-size:10px;color:var(--t3)">header row ${data.hdr + 1} ·
        first: <b>${String(data.rows[0]?.['Customer'] ?? '?')}</b> /
        ${String(data.rows[0]?.['Phone'] ?? 'no phone')}</div>`;
    } else {
      _impSales = data.rows;
      const inv = new Set(data.rows.map(r => r['No'])).size;
      const val = data.rows.reduce((a, r) => a + (parseFloat(String(r['Amount(₹)'] ?? '').replace(/,/g, '')) || 0), 0);
      info.innerHTML = `<b>${data.rows.length}</b> lines · <b>${inv}</b> invoices ·
        <b>₹${Math.round(val).toLocaleString('en-IN')}</b>
        <div style="margin-top:6px;font-size:10px;color:var(--t3)">header row ${data.hdr + 1} ·
        first: <b>${String(data.rows[0]?.['No'] ?? '?')}</b> /
        ${String(data.rows[0]?.['Customer'] ?? '?')} /
        ${String(data.rows[0]?.['Item'] ?? '?')}</div>`;
    }
    const btn = document.getElementById('imp-go');
    if (btn) btn.disabled = !(_impCust && _impSales);
  });
}

function impDate(v) {
  if (!v) return null;
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);   // dd/mm/yyyy
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const d = new Date(s);
  return isNaN(d) ? null : d.toISOString().slice(0, 10);
}
function impNum(v) {
  const n = parseFloat(String(v ?? '').replace(/[,₹\s]/g, ''));
  return isNaN(n) ? null : n;
}

async function impRun() {
  const btn = document.getElementById('imp-go');
  btn.disabled = true; btn.textContent = 'Importing…';
  document.getElementById('imp-log').innerHTML = '';
  const FN = SB_URL + '/functions/v1/alignbooks-import';
  const H = { 'Content-Type': 'application/json', 'apikey': ANON,
              'Authorization': `Bearer ${_adminSession?.access_token || ANON}` };
  try {
    // ── customers first: sales lines link to them by name ──
    impLog(`Customers: sending ${_impCust.length}…`);
    const custRows = _impCust.map(r => ({
      code: r['Code'], name: r['Customer'], phone: r['Phone'], city: r['City'],
      territory: r['Territory'], gst: r['GST'], last_bill: impDate(r['Last Bill Date']),
    }));
    let res = await fetch(FN, { method: 'POST', headers: H,
      body: JSON.stringify({ action: 'import_customers', rows: custRows }) });
    let d = await res.json();
    if (!d.ok) { impLog('FAILED: ' + d.error, 'err'); return; }
    impLog(`  ${d.processed} customers · ${d.b2b} B2B · ${d.b2c} B2C · ${d.no_mobile} need a mobile`, 'ok');

    // ── sales lines, chunked: 19k rows will not fit in one request ──
    const CH = 2000;
    impLog(`Sales: sending ${_impSales.length} lines in ${Math.ceil(_impSales.length / CH)} chunks…`);
    let total = 0, unmatched = 0, uncat = 0;
    for (let i = 0; i < _impSales.length; i += CH) {
      const rows = _impSales.slice(i, i + CH).map(r => ({
        invoice: r['No'], date: impDate(r['Date']), customer: r['Customer'],
        salesman: r['Salesman'], item: r['Item'], code: r['Code'], hsn: r['HSN Code'],
        unit: r['Unit'], qty: impNum(r['Qty']), rate: impNum(r['Rate']), amount: impNum(r['Amount(₹)']),
      }));
      res = await fetch(FN, { method: 'POST', headers: H,
        body: JSON.stringify({ action: 'import_sales', rows, first_chunk: i === 0 }) });
      d = await res.json();
      if (!d.ok) { impLog('FAILED at row ' + i + ': ' + d.error, 'err'); return; }
      total += d.processed; unmatched += d.unmatched_customer || 0; uncat += d.uncategorised || 0;
      impLog(`  chunk ${Math.floor(i / CH) + 1}: ${d.processed} lines`);
    }
    impLog(`  ${total} lines imported`, 'ok');
    if (unmatched) impLog(`  ${unmatched} lines could not be matched to a customer`, 'err');
    if (uncat) impLog(`  ${uncat} lines have an HSN code with no category mapped`, 'err');

    // Link + categorise in SQL. The edge function's own name lookup silently
    // truncated at Supabase's 1000-row default, leaving 45% of lines unmatched.
    // SQL has no such cap.
    impLog('Linking lines to customers and categorising…');
    const rep = await sbFetch('rpc/repair_import', { method: 'POST', body: '{}' });
    if (rep) impLog(`  ${rep.linked} linked · ${rep.recategorised} categorised`, 'ok');

    impLog('Rolling up spend and deriving construction stage…');
    res = await fetch(FN, { method: 'POST', headers: H, body: JSON.stringify({ action: 'finalise' }) });
    d = await res.json();
    if (!d.ok) { impLog('FAILED: ' + d.error, 'err'); return; }
    impLog('Done.', 'ok');
    impStats();
  } catch (e) {
    impLog('ERROR: ' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Import';
  }
}

async function verifyBrief(briefId, contractorId, contractorName) {
  if (!confirm(`Verify brief for ${contractorName}?\n\nThis will award 500 Club points to the contractor.`)) return;
  try {
    await sbFetch(`project_briefs?id=eq.${briefId}`, {method:'PATCH', headers:{'Prefer':'return=minimal'}, body:JSON.stringify({status:'verified', verified_by:_adminProfile.name, verified_at:new Date().toISOString()})});
    if (contractorId) {
      // Award 500 points
      await sbFetch(`contractor_loyalty`, {method:'POST', headers:{'Prefer':'return=minimal'}, body:JSON.stringify({contractor_id:contractorId, transaction_type:'bonus', points:500, reference_type:'project_brief', reference_id:briefId, description:'Project brief verified — 500 pts bonus'})});
      await sbFetch(`project_briefs?id=eq.${briefId}`, {method:'PATCH', headers:{'Prefer':'return=minimal'}, body:JSON.stringify({points_awarded:true})});
    }
    toast(`✅ Brief verified — 500 pts awarded to ${contractorName}`, 'ok');
    loadBriefs();
  } catch(e) { toast('Failed: '+e.message, 'err'); }
}

async function rejectBrief(briefId) {
  const reason = prompt('Rejection reason (optional):');
  try {
    await sbFetch(`project_briefs?id=eq.${briefId}`, {method:'PATCH', headers:{'Prefer':'return=minimal'}, body:JSON.stringify({status:'rejected', rejection_reason:reason||null, verified_by:_adminProfile.name, verified_at:new Date().toISOString()})});
    toast('Brief rejected', 'ok');
    loadBriefs();
  } catch(e) { toast('Failed: '+e.message, 'err'); }
}

async function savePromo() {
  const code = document.getElementById('promo-code')?.value?.trim()?.toUpperCase();
  const val = parseFloat(document.getElementById('promo-val')?.value||0);
  if (!code||!val) { toast('Code and value required','err'); return; }
  try {
    await sbFetch(`promo_codes`, {method:'POST', headers:{'Prefer':'return=minimal'}, body:JSON.stringify({
      code, discount_type:document.getElementById('promo-type').value,
      discount_value:val, min_order_amount:parseFloat(document.getElementById('promo-min')?.value||0)||null,
      max_discount_amount:parseFloat(document.getElementById('promo-max')?.value||0)||null,
      description:document.getElementById('promo-desc')?.value?.trim()||null, is_active:true
    })});
    toast('Promo code created','ok'); closeModal(); loadPromos();
  } catch(e) { toast('Failed: '+e.message,'err'); }
}

async function togglePromo(id, isActive) {
  try {
    await sbFetch(`promo_codes?id=eq.${id}`, {method:'PATCH', headers:{'Prefer':'return=minimal'}, body:JSON.stringify({is_active:!isActive})});
    toast(`Promo ${isActive?'disabled':'enabled'}`,'ok'); loadPromos();
  } catch(e) { toast('Failed','err'); }
}

function openPermissionManager(uid, name, role, currentPerms) {
  const perms = Array.isArray(currentPerms) ? currentPerms : [];
  
  const moduleHtml = Object.entries(MODULE_PERMISSIONS).map(([section, modules])=>`
    <div style="margin-bottom:14px">
      <div style="font-size:10px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--bdr)">${section}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        ${Object.entries(modules).map(([key, label])=>`
          <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card2);border-radius:8px;cursor:pointer;border:1px solid ${perms.includes(key)?'var(--b)':'var(--bdr)'}">
            <input type="checkbox" id="perm-${key}" value="${key}" ${perms.includes(key)?'checked':''} 
              onchange="this.closest('label').style.borderColor=this.checked?'var(--b)':'var(--bdr)'"
              style="accent-color:var(--b);width:14px;height:14px;flex-shrink:0">
            <span style="font-size:12px;font-weight:600;color:var(--t1)">${label}</span>
          </label>`).join('')}

async function createStaffOffer() {
  const name = document.getElementById('new-name')?.value?.trim();
  const phone = document.getElementById('new-phone')?.value?.trim();
  const role = document.getElementById('new-role')?.value?.trim();
  const salary = parseFloat(document.getElementById('new-salary')?.value||0);
  const startDate = document.getElementById('new-startdate')?.value;
  if (!name) { toast('Enter candidate name','err'); return; }
  if (!phone||phone.length<10) { toast('Enter valid 10-digit phone','err'); return; }
  if (!role) { toast('Enter role/designation','err'); return; }
  if (!salary) { toast('Enter monthly salary','err'); return; }
  if (!startDate) { toast('Select start date','err'); return; }

  const pin = Math.floor(1000+Math.random()*9000).toString();
  const offer = {
    candidate_name: name, candidate_phone: phone, role,
    department: document.getElementById('new-dept')?.value||'',
    salary, start_date: startDate,
    probation_months: parseInt(document.getElementById('new-probation')?.value||6),
    reporting_manager: document.getElementById('new-manager')?.value?.trim()||'',
    custom_clauses: document.getElementById('new-clauses')?.value?.trim()||'',
    pin, status: 'sent',
    created_by_name: _currentProfile?.name||'HR',
    created_at: new Date().toISOString(),
    auth_account_created: false
  };

  try {
    const res = await sbFetch('staff_offers', {method:'POST', headers:{'Prefer':'return=representation'}, body:JSON.stringify(offer)});
    const saved = Array.isArray(res) ? res[0] : res;
    if (!saved?.id) throw new Error('Failed to save offer');
    closeModal();
    showOfferWhatsApp(saved);
    if (typeof loadHR === 'function') setTimeout(loadHR, 500);
  } catch(e) { toast('Error: '+e.message,'err'); }
}
window.createStaffOffer = createStaffOffer;

async function activateStaffFromOffer(offerId) {
  const res = await sbFetch('staff_offers?id=eq.'+offerId+'&select=*').catch(()=>[]);
  const offer = Array.isArray(res) ? res[0] : res;
  if (!offer) { toast('Offer not found','err'); return; }
  const data = offer.submitted_data || {};

  const pin = offer.pin || '123456';
  const name = offer.candidate_name;
  const phone = offer.candidate_phone;
  const role = data.role || offer.role || 'staff';

  if (!confirm(`Activate account for ${name} (${phone})? This will create their login with PIN ${pin}.`)) return;

  try {
    // Create Supabase auth user via edge function
    const fnUrl = `${SB_URL}/functions/v1/create-staff-user`;
    const fnRes = await fetch(fnUrl, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+ANON, 'apikey':ANON },
      body: JSON.stringify({ phone, pin, name, role })
    });
    const fnData = await fnRes.json().catch(()=>({}));

    if (!fnData.ok) {
      // Fallback — create profile directly (requires service role, won't work here)
      // Show manual instruction instead
      toast('⚠️ Auto-create not available. Create account manually in Supabase Auth.','warn');
      openModal(`<div class="modal-title">Manual Account Creation</div>
        <div style="font-size:13px;color:var(--t2);line-height:1.8">
          <div><strong>Name:</strong> ${name}</div>
          <div><strong>Email:</strong> ${phone}@vwholesale.app</div>
          <div><strong>PIN (password):</strong> ${pin}</div>
          <div><strong>Role:</strong> ${role}</div>
        </div>
        <p style="font-size:12px;color:var(--t3);margin-top:10px">Go to Supabase → Authentication → Users → Add User with above credentials. Then update profiles table to set status=approved.</p>
        <button onclick="closeModal()" class="btn btn-primary" style="width:100%;margin-top:12px">Got it</button>`);
      return;
    }

    // Mark offer as approved
    await sbFetch('staff_offers?id=eq.'+offerId, {method:'PATCH', headers:{'Prefer':'return=minimal'}, body:JSON.stringify({status:'approved',auth_account_created:true,reviewed_by_name:_currentProfile?.name,reviewed_at:new Date().toISOString()})});

    toast(`✅ Account created for ${name}. PIN: ${pin}`,'ok');
    loadHR();
  } catch(e) {
    toast('Error: '+e.message,'err');
  }
}
window.activateStaffFromOffer = activateStaffFromOffer;

  document.getElementById('page-content').innerHTML = `

          <td>${o.customer_name||'—'}</td>
          <td style="font-weight:800">₹${parseFloat(o.grand_total||0).toLocaleString('en-IN')}</td>
          <td style="color:var(--t3)">${o.payment_method||'COD'}</td>
          <td><span class="badge ${o.payment_status==='paid'?'badge-green':o.payment_status==='cancelled'?'badge-red':'badge-amber'}">${o.payment_status}</span></td>

// ── GST ──
async function loadGST() {
  setPageTitle('GST Reports');
  document.getElementById('page-content').innerHTML = `
    <div class="card">
      <div class="card-title">GST Summary</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div><label class="form-lbl">From Date</label><input type="date" id="gst-from" class="form-inp"></div>
        <div><label class="form-lbl">To Date</label><input type="date" id="gst-to" class="form-inp"></div>
      </div>
      <button class="btn btn-primary" onclick="generateGSTReport()">Generate Report</button>
    </div>
    <div id="gst-report"></div>`;
}
async function generateGSTReport() {
  const from = document.getElementById('gst-from')?.value;
  const to = document.getElementById('gst-to')?.value;
  if (!from||!to) { toast('Select date range','err'); return; }
  let q = `orders?select=order_no,grand_total,items,created_at&order_status=neq.cancelled`;
  if (from) q += `&created_at=gte.${from}`;
  if (to) q += `&created_at=lte.${to}T23:59:59`;
  const orders = await sbFetch(q).catch(()=>[]);
  const total = (orders||[]).reduce((s,o)=>s+parseFloat(o.grand_total||0),0);
  const gst18 = total * 0.18 / 1.18;
  document.getElementById('gst-report').innerHTML = `
    <div class="card">
      <div class="card-title">GST Report: ${from} to ${to}</div>
      <div style="display:grid;gap:8px">
        <div style="display:flex;justify-content:space-between;padding:10px;background:var(--card2);border-radius:8px">
          <span>Total Sales (incl. GST)</span><strong>₹${total.toLocaleString('en-IN')}</strong>
        </div>
        <div style="display:flex;justify-content:space-between;padding:10px;background:var(--card2);border-radius:8px">
          <span>Taxable Value</span><strong>₹${(total-gst18).toLocaleString('en-IN')}</strong>
        </div>
        <div style="display:flex;justify-content:space-between;padding:10px;background:var(--blt);border-radius:8px;border:1px solid var(--b)">
          <span>GST Collected (approx 18%)</span><strong style="color:var(--b)">₹${gst18.toLocaleString('en-IN')}</strong>
        </div>
        <div style="font-size:11px;color:var(--t3);padding:8px">Note: For exact GSTR-1/GSTR-3B, export from AlignBooks ERP</div>
      </div>
    </div>`;
}
window.generateGSTReport = generateGSTReport;

function hrTab(tab) {
  ['team','payroll','advances','docs','onboard','slabs'].forEach(t => {
    document.getElementById('hr-panel-'+t).style.display = t===tab ? 'block' : 'none';
    const btn = document.getElementById('hr-tab-'+t);
    if (btn) { btn.className = t===tab ? 'btn btn-primary' : 'btn btn-ghost'; btn.style.fontSize='12px'; }
  });
  if (tab==='slabs') loadIncentiveSlabs();
}

async function loadIncentiveSlabs() {
  const slabs = await sbFetch('incentive_slabs?select=*&order=min_target.desc').catch(()=>[]);
  document.getElementById('slabs-content').innerHTML = `

    sbFetch('payroll_runs?profile_id=eq.'+profileId+'&order=month.desc&limit=6').catch(()=>[]),
    sbFetch('staff_advances?profile_id=eq.'+profileId+'&order=requested_at.desc&limit=5').catch(()=>[]),
    sbFetch('staff_documents?profile_id=eq.'+profileId).catch(()=>[]),

  modal.id = 'hr-modal';

  modal.innerHTML = `

    <div style="background:#0A1628;padding:16px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:16px;font-weight:900;color:#fff">${name}</div>
        <div style="font-size:11px;color:#64748B">${hr?.designation||'—'} · ${hr?.employee_code||'No code set'}</div>
      </div>
      <button onclick="document.getElementById('hr-modal').remove()" style="background:none;border:none;color:#64748B;font-size:20px;cursor:pointer">✕</button>
    </div>
    <div style="padding:16px;display:grid;gap:12px">

      <!-- Profile Form -->
      <div class="card" style="padding:14px">
        <div style="font-weight:800;margin-bottom:10px;color:var(--t2)">📋 HR PROFILE</div>

async function saveStaffHR(profileId) {
  const basic = parseFloat(document.getElementById('hrp-basic')?.value||0);
  const hra = parseFloat(document.getElementById('hrp-hra')?.value||0);
  const allow = parseFloat(document.getElementById('hrp-allow')?.value||0);
  const gross = parseFloat(document.getElementById('hrp-gross')?.value||0) || (basic+hra+allow);
  const join = document.getElementById('hrp-join')?.value;
  const probEnd = join ? new Date(new Date(join).setMonth(new Date(join).getMonth()+6)).toISOString().split('T')[0] : null;

  const payload = {
    profile_id: profileId,
    employee_code: document.getElementById('hrp-code')?.value?.trim()||null,
    designation: document.getElementById('hrp-desig')?.value?.trim()||null,
    department: document.getElementById('hrp-dept')?.value?.trim()||null,
    joining_date: join||null,
    probation_end: probEnd,
    basic, hra, allowance: allow, gross_salary: gross,
    bank_account: document.getElementById('hrp-bank')?.value?.trim()||null,
    updated_at: new Date().toISOString()
  };

  // Upsert staff_hr
  const res = await fetch(supabaseUrl+'/rest/v1/staff_hr?profile_id=eq.'+profileId, {
    method: 'PATCH',
    headers: {'apikey':supabaseKey,'Authorization':'Bearer '+supabaseKey,'Content-Type':'application/json','Prefer':'return=minimal'},
    body: JSON.stringify(payload)
  });
  if (res.status === 404 || res.status === 0) {
    // Row doesn't exist — insert
    await fetch(supabaseUrl+'/rest/v1/staff_hr', {
      method: 'POST',
      headers: {'apikey':supabaseKey,'Authorization':'Bearer '+supabaseKey,'Content-Type':'application/json','Prefer':'return=minimal'},
      body: JSON.stringify(payload)
    });
  }
  showToast('✅ HR profile saved');
  document.getElementById('hr-modal')?.remove();
  loadHR();
}

async function runPayroll() {
  const month = document.getElementById('payroll-month')?.value;

  if (!confirm('Run payroll for '+new Date(month+'-01').toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'? This will calculate salaries for all staff.')) return;
  showToast('Running payroll…');
  try {
    // Use the VW_HR_SELF utility if available
    if (typeof VW_HR_SELF !== 'undefined') {
      const results = await VW_HR_SELF.runMonthlyPayroll(month);
      showToast('✅ Payroll run complete — '+results.length+' staff processed');
    } else {
      showToast('Payroll engine not loaded — open Staff Portal first');
    }
    setTimeout(()=>loadHR(), 500);
  } catch(e) { showToast('Error: '+e.message); }
}

function fieldStageLabel(s) {
  const map = {foundation:'Foundation',structure:'Structure',brick_work:'Brick Work',
    plastering:'Plastering',tiling_ready:'Tiling Ready',tiling_in_progress:'Tiling',
    finishing:'Finishing',handover:'Handover',renovation:'Renovation'};
  return map[s] || s || '—';
}

function getCycleRange() {
  const now = new Date();
  const d = now.getDate();
  let start, end;
  if (d >= 21) {
    start = new Date(now.getFullYear(), now.getMonth(), 21);
    end   = new Date(now.getFullYear(), now.getMonth()+1, 20, 23, 59, 59);
  } else {
    start = new Date(now.getFullYear(), now.getMonth()-1, 21);
    end   = new Date(now.getFullYear(), now.getMonth(), 20, 23, 59, 59);
  }
  const opts = {day:'numeric',month:'short'};
  return { start, end, label: `${start.toLocaleDateString('en-IN',opts)} – ${end.toLocaleDateString('en-IN',opts)}` };
}

async function loadFieldMap() {
  setPageTitle('Live Field Map');

  const { data: staff } = await sbFetch(`staff?select=id,name,designation,role&active=eq.true&department=eq.Field`).catch(()=>[]);
  const ids = (staff||[]).map(s=>s.id);

  let locRows = [];

  }

  // Last loc per rep
  const lastLoc = {};
  (locRows||[]).forEach(l => { if (!lastLoc[l.staff_id]) lastLoc[l.staff_id] = l; });

  // Today's visit count per rep
  const todayIST = new Date(new Date().getTime() + 5.5*60*60*1000).toISOString().split('T')[0];

  const repCards = (staff||[]).map(s => {
    const loc = lastLoc[s.id];

    return `

        </div>
        <div style="text-align:right;min-width:80px;">
          ${isLive ? `<span class="badge badge-green">🟢 Live ${locAge}m ago</span>` :

            `<span class="badge badge-red">No signal</span>`}

  document.getElementById('page-content').innerHTML = `

  const alerts = await sbFetch(`field_alerts?select=*,staff:staff_id(name)&resolved_at=is.null&order=triggered_at.desc&limit=20`).catch(()=>[]);

async function resolveAlert(id) {
  await sbFetch(`field_alerts?id=eq.${id}`, {method:'PATCH',body:JSON.stringify({resolved_at:new Date().toISOString()}),headers:{'Prefer':'return=minimal'}}).catch(()=>{});
  loadFieldMap();
}

  const { start, end, label } = getCycleRange();

  // Get cycle stats per person
  let cycleVisits = {}, cycleKm = {}, cycleFuel = {};
  const ids = (staff||[]).map(s=>s.id);
  if (ids.length) {
    const [vrows, atrows] = await Promise.all([

    ]);
    (vrows||[]).forEach(v => { cycleVisits[v.staff_id] = (cycleVisits[v.staff_id]||0)+1; });

      cycleKm[a.staff_id] = (cycleKm[a.staff_id]||0) + (parseFloat(a.km_travelled)||0);

function showAddStaffModal() {
  document.getElementById('sf-edit-id').value = '';
  document.getElementById('sf-name').value = '';
  document.getElementById('sf-phone').value = '';
  document.getElementById('sf-desig').value = '';
  document.getElementById('sf-role').value = 'Field Executive';
  document.getElementById('sf-territory').value = '';
  document.getElementById('sf-city-field').value = 'Vijayawada';
  document.getElementById('staff-modal-title').textContent = 'Add Field Staff';
  document.getElementById('staff-modal').style.display = 'flex';
}

function editStaffModal(s) {
  document.getElementById('sf-edit-id').value = s.id;
  document.getElementById('sf-name').value = s.name||'';
  document.getElementById('sf-phone').value = s.phone||'';
  document.getElementById('sf-desig').value = s.designation||'';
  document.getElementById('sf-role').value = s.role||'Field Executive';
  document.getElementById('staff-modal-title').textContent = 'Edit Staff — ' + s.name;
  document.getElementById('staff-modal').style.display = 'flex';
}

async function saveStaffModal() {
  const id = document.getElementById('sf-edit-id').value;
  const payload = {
    name: document.getElementById('sf-name').value.trim(),
    phone: document.getElementById('sf-phone').value.trim().replace(/\D/g,'').slice(-10),
    designation: document.getElementById('sf-desig').value,
    role: document.getElementById('sf-role').value,
    department: 'Field',
    active: true,
  };
  if (!payload.name || !payload.phone || !payload.designation) { alert('Name, phone and designation are required'); return; }
  if (id) {
    await sbFetch(`staff?id=eq.${id}`, {method:'PATCH',body:JSON.stringify(payload),headers:{'Prefer':'return=minimal'}}).catch(e=>alert('Error: '+e.message));
  } else {
    await sbFetch('staff', {method:'POST',body:JSON.stringify(payload),headers:{'Prefer':'return=minimal'}}).catch(e=>alert('Error: '+e.message));
  }
  document.getElementById('staff-modal').style.display = 'none';
  loadFieldTeam();
}

async function toggleStaffActive(id, current) {
  if (!confirm(`${current?'Deactivate':'Activate'} this staff member?`)) return;
  await sbFetch(`staff?id=eq.${id}`, {method:'PATCH',body:JSON.stringify({active:!current}),headers:{'Prefer':'return=minimal'}}).catch(()=>{});
  loadFieldTeam();
}

let _allVisitRows = [];

function updateVisitSummaryCards(rows) {
  const total = rows.length;
  const avgQ = total ? Math.round(rows.reduce((s,v)=>s+(v.visit_quality_score||0),0)/total) : 0;
  const withAI = rows.filter(v=>v.ai_stage_detected).length;
  const pipelineMin = rows.reduce((s,v)=>s+(v.ai_estimated_value_min||0),0);
  const pipelineMax = rows.reduce((s,v)=>s+(v.ai_estimated_value_max||0),0);
  const today = new Date().toISOString().split('T')[0];
  const overdue = rows.filter(v=>v.next_action_date && v.next_action_date < today && !v.converted_invoice_id).length;
  const converted = rows.filter(v=>v.converted_invoice_id).length;
  const newVisits = rows.filter(v=>!v.is_followup).length;
  const followups = rows.filter(v=>v.is_followup).length;

  // Stage breakdown
  const stages = {};
  rows.forEach(v => { const s = v.ai_stage_detected || v.construction_stage || 'unknown';
    stages[s] = (stages[s]||0)+1; });
  const topStage = Object.entries(stages).sort((a,b)=>b[1]-a[1])[0];

  // Top requirements from AI
  const allReqs = rows.flatMap(v=>v.ai_requirements||[]);
  const reqCount = {};
  allReqs.forEach(r=>{ reqCount[r]=(reqCount[r]||0)+1; });
  const topReqs = Object.entries(reqCount).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([r,c])=>`${r}(${c})`).join(', ');

  const el = (id,val) => { const e=document.getElementById(id); if(e) e.textContent=val; };
  el('fv-stat-total', total);
  el('fv-stat-quality', avgQ+'%');
  el('fv-stat-ai', withAI+'/'+total);
  el('fv-stat-pipeline', pipelineMin>0 ? '₹'+(pipelineMin/100000).toFixed(1)+'L–₹'+(pipelineMax/100000).toFixed(1)+'L' : '—');
  el('fv-stat-followup', overdue||'0');

  // Update extended summary if panel exists
  const ext = document.getElementById('fv-stat-extended');
  if (ext) ext.innerHTML = `
    <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--t2);padding:8px 0;">
      <span>🆕 <b>${newVisits}</b> new · 🔄 <b>${followups}</b> follow-ups</span>
      <span>✅ <b>${converted}</b> converted</span>
      ${topStage ? `<span>📊 Top stage: <b>${fieldStageLabel(topStage[0])}</b> (${topStage[1]})</span>` : ''}
      ${topReqs ? `<span>🏗️ Top needs: <b>${topReqs}</b></span>` : ''}
    </div>`;
}

function populateRepFilter(visits) {
  const sel = document.getElementById('fv-filter-rep');
  if (!sel) return;
  const reps = [...new Set(visits.map(v=>v.executive_name).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All reps</option>' + reps.map(r=>`<option value="${r}">${r}</option>`).join('');
}

function applyVisitFilters() {
  const search = (document.getElementById('fv-search')?.value||'').toLowerCase();
  const dateFilter = document.getElementById('fv-filter-date')?.value||'';
  const repFilter = document.getElementById('fv-filter-rep')?.value||'';
  const stageFilter = document.getElementById('fv-filter-stage')?.value||'';
  const aiFilter = document.getElementById('fv-filter-ai')?.value||'';
  const scoreFilter = document.getElementById('fv-filter-score')?.value||'';
  const typeFilter = document.getElementById('fv-filter-type')?.value||'';

  const now = new Date();
  const todayStr = now.toISOString().split('T')[0];
  const yesterday = new Date(now); yesterday.setDate(yesterday.getDate()-1);
  const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate()-7);
  const monthAgo = new Date(now); monthAgo.setDate(monthAgo.getDate()-30);
  const cycleDay = now.getDate() >= 21
    ? new Date(now.getFullYear(), now.getMonth(), 21)
    : new Date(now.getFullYear(), now.getMonth()-1, 21);

  const filtered = _allVisitRows.filter(v => {
    const vDate = new Date(v.created_at);
    const vDateStr = vDate.toISOString().split('T')[0];

    if (search && !( (v.executive_name||'').toLowerCase().includes(search) ||
                     (v.site_address||'').toLowerCase().includes(search) ||
                     (v.city||'').toLowerCase().includes(search) ||
                     (v.ai_stage_detected||'').toLowerCase().includes(search) )) return false;

    if (dateFilter === 'today' && vDateStr !== todayStr) return false;
    if (dateFilter === 'yesterday' && vDateStr !== yesterday.toISOString().split('T')[0]) return false;
    if (dateFilter === 'week' && vDate < weekAgo) return false;
    if (dateFilter === 'month' && vDate < monthAgo) return false;
    if (dateFilter === 'cycle' && vDate < cycleDay) return false;

    if (repFilter && v.executive_name !== repFilter) return false;
    if (stageFilter && v.construction_stage !== stageFilter) return false;
    if (aiFilter === 'with_ai' && !v.ai_stage_detected) return false;
    if (aiFilter === 'no_ai' && v.ai_stage_detected) return false;
    if (aiFilter.startsWith('ai_') && (v.ai_stage_detected||'').toLowerCase().replace(/\s/g,'_') !== aiFilter.replace('ai_','')) return false;

    if (scoreFilter === 'high' && (v.visit_quality_score||0) < 90) return false;
    if (scoreFilter === 'mid' && ((v.visit_quality_score||0) < 60 || (v.visit_quality_score||0) >= 90)) return false;
    if (scoreFilter === 'low' && (v.visit_quality_score||0) >= 60) return false;

    if (typeFilter === 'new' && v.is_followup) return false;
    if (typeFilter === 'followup' && !v.is_followup) return false;
    if (typeFilter === 'overdue' && !(v.next_action_date && v.next_action_date < todayStr && !v.converted_invoice_id)) return false;
    if (typeFilter === 'due_today' && v.next_action_date !== todayStr) return false;
    if (typeFilter === 'converted' && !v.converted_invoice_id) return false;
    if (typeFilter === 'high_value' && (v.ai_estimated_value_min||0) < 1000000) return false;

    return true;
  });

  const countEl = document.getElementById('fv-filter-count');
  if (countEl) countEl.textContent = filtered.length < _allVisitRows.length
    ? `Showing ${filtered.length} of ${_allVisitRows.length}` : '';

  renderVisitRows(filtered);
  updateVisitSummaryCards(filtered);
}

function clearVisitFilters() {
  ['fv-search','fv-filter-date','fv-filter-rep','fv-filter-stage','fv-filter-ai','fv-filter-score','fv-filter-type'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  const countEl = document.getElementById('fv-filter-count');
  if (countEl) countEl.textContent = '';
  renderVisitRows(_allVisitRows);
  updateVisitSummaryCards(_allVisitRows);
}

function renderVisitRows(visits) {
  const tbody = document.getElementById('visits-tbody');
  if (!tbody) return;
  const today = new Date().toISOString().split('T')[0];
  tbody.innerHTML = visits.map(v => {
    const score = v.visit_quality_score || 0;
    const scoreColor = score >= 90 ? 'var(--green)' : score >= 60 ? 'var(--gold)' : 'var(--red)';
    const contacts = v.site_contacts?.length || 0;
    const aiStage = v.ai_stage_detected
      ? `<span style="padding:2px 8px;border-radius:12px;background:rgba(139,92,246,.15);color:#A78BFA;font-size:11px;font-weight:600;">${fieldStageLabel(v.ai_stage_detected)}</span>`
      : '<span style="color:var(--t3);font-size:11px;">No AI yet</span>';
    const aiVal = v.ai_estimated_value_min
      ? `<span style="color:var(--gold);font-weight:600;">₹${(v.ai_estimated_value_min/100000).toFixed(1)}L–${(v.ai_estimated_value_max/100000).toFixed(1)}L</span>`
      : '—';
    const followupDate = v.next_action_date;
    const followupOverdue = followupDate && followupDate < today;
    const followupDisplay = followupDate
      ? `<span style="color:${followupOverdue?'var(--red)':'var(--t2)'};">${followupOverdue?'⚠️ ':''}${new Date(followupDate).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span>`
      : '—';
    return `<tr onclick="showVisitDetail(${v.id})" style="cursor:pointer;">
      <td style="white-space:nowrap;font-size:12px;">
        ${new Date(v.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
        <span style="color:var(--t3);"> ${new Date(v.created_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span>
        ${v.is_followup ? '<span style="margin-left:4px;font-size:10px;padding:1px 5px;border-radius:8px;background:rgba(59,130,246,.15);color:#60A5FA;">Follow-up</span>' : ''}
      </td>
      <td style="font-weight:700;">${v.executive_name||'—'}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${v.site_address||'—'}</td>
      <td><span class="badge badge-blue">${fieldStageLabel(v.construction_stage)}</span></td>
      <td style="font-weight:700;color:${scoreColor};">${score}%</td>
      <td style="text-align:center;">${contacts}</td>
      <td>${aiStage}</td>
      <td>${aiVal}</td>
      <td>${followupDisplay}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--t3);">No visits match filters</td></tr>';
}

function filterVisitsByStage(s) { document.getElementById('fv-filter-stage').value=s; applyVisitFilters(); }
function filterVisitsByScore(s) { document.getElementById('fv-filter-score').value=s; applyVisitFilters(); }

function showAddStaffToVertical(vertCode, desigPreset) {
  document.getElementById('org-sf-name').value = '';
  document.getElementById('org-sf-phone').value = '';
  document.getElementById('org-sf-desig').value = desigPreset || '';
  document.getElementById('org-sf-vertical').value = vertCode || '';
  document.getElementById('org-sf-reports').value = '';
  document.getElementById('org-sf-edit-id').value = '';
  document.getElementById('org-modal-title').textContent = 'Add Field Staff';
  document.getElementById('org-staff-modal').style.display = 'flex';
}

function quickAssignVertical(staffId) {
  document.getElementById('org-sf-edit-id').value = staffId;
  document.getElementById('org-sf-name').value = '';
  document.getElementById('org-modal-title').textContent = 'Assign to Vertical';
  document.getElementById('org-staff-modal').style.display = 'flex';
}

async function saveOrgStaff() {
  const id = document.getElementById('org-sf-edit-id').value;
  const desig = document.getElementById('org-sf-desig').value;
  const payload = {
    name: document.getElementById('org-sf-name').value.trim(),
    phone: document.getElementById('org-sf-phone').value.trim().replace(/[^0-9]/g,'').slice(-10),
    designation: desig,
    role: desig.includes('ASM') ? 'ASM' : desig.includes('Team Leader') ? 'Team Leader' :
          desig.includes('State Head') ? 'State Head' : desig,
    vertical: document.getElementById('org-sf-vertical').value || null,
    reporting_to: parseInt(document.getElementById('org-sf-reports').value) || null,
    department: 'Field',
    active: true,
  };
  if (id) {
    // Only update filled fields when editing
    const patch = {};
    if (payload.vertical) patch.vertical = payload.vertical;
    if (payload.reporting_to) patch.reporting_to = payload.reporting_to;
    if (payload.designation) patch.designation = payload.designation;
    await sbFetch(`staff?id=eq.${id}`, {method:'PATCH', body:JSON.stringify(patch), headers:{'Prefer':'return=minimal'}}).catch(e=>alert(e.message));
  } else {
    if (!payload.name || !payload.phone || !payload.designation || !payload.vertical) {
      alert('Name, phone, designation and vertical are required'); return;
    }
    await sbFetch('staff', {method:'POST', body:JSON.stringify(payload), headers:{'Prefer':'return=minimal'}}).catch(e=>alert(e.message));
  }
  document.getElementById('org-staff-modal').style.display = 'none';
  loadOrgChart();
}

function editTLAreas(staffId, verticalCode, currentAreas) {
  document.getElementById('tl-area-staff-id').value = staffId;
  document.getElementById('tl-area-vertical-code').value = verticalCode;
  document.getElementById('tl-area-notes').value = '';
  // Check boxes for current areas
  document.querySelectorAll('[id^="tl-corr-"]').forEach(cb => {
    cb.checked = currentAreas.includes(cb.value);
  });
  document.getElementById('tl-area-modal').style.display = 'flex';
}

async function saveTLAreas() {
  const staffId = parseInt(document.getElementById('tl-area-staff-id').value);
  const vertCode = document.getElementById('tl-area-vertical-code').value;
  const notes = document.getElementById('tl-area-notes').value.trim();
  const selected = [...document.querySelectorAll('[id^="tl-corr-"]:checked')].map(cb => cb.value);

  // Delete existing assignments for this TL + vertical
  await sbFetch(`tl_area_assignments?staff_id=eq.${staffId}&vertical_code=eq.${vertCode}`,
    {method:'DELETE', headers:{'Prefer':'return=minimal'}}).catch(()=>{});

  // Insert new assignments
  if (selected.length) {
    const rows = selected.map(c => ({
      staff_id: staffId, corridor_code: c, vertical_code: vertCode, notes
    }));
    await sbFetch('tl_area_assignments', {method:'POST', body:JSON.stringify(rows), headers:{'Prefer':'return=minimal'}}).catch(e=>alert(e.message));
  }

  // Update area notes on staff record
  if (notes) {
    await sbFetch(`staff?id=eq.${staffId}`, {method:'PATCH', body:JSON.stringify({area_notes:notes}), headers:{'Prefer':'return=minimal'}}).catch(()=>{});
  }

  document.getElementById('tl-area-modal').style.display = 'none';
  loadOrgChart();
}

function updateTLDropdown() {
  const vertical = document.getElementById('t-vertical').value;
  const sel = document.getElementById('t-staff');
  sel.innerHTML = '<option value="">Select TL / Exec…</option>';
  (territoryStaff||[])
    .filter(s => {
      const r = ((s.role||'') + ' ' + (s.designation||'')).toLowerCase();
      const notAdmin = !r.includes('asm') && !r.includes('cluster head') && !r.includes('region head');
      const matchVert = !vertical || s.vertical === vertical;
      return notAdmin && matchVert;
    })
    .forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id; opt.textContent = s.name + ' (' + (s.designation||s.role||'—') + ')';
      sel.appendChild(opt);
    });

let drawPoints = [];       // polygon click points
let drawPolyline = null;   // preview line while drawing
let drawMarkers = [];      // click point markers
let drawMode = null;       // 'polygon' | 'circle' | 'rectangle'
let circleOverlay = null;
let rectOverlay = null;
let dragStart = null;
let mapClickListener = null;
let mapMouseListener = null;
let mapDblClickListener = null;

function clearDrawListeners() {
  if (mapClickListener)    google.maps.event.removeListener(mapClickListener);
  if (mapMouseListener)    google.maps.event.removeListener(mapMouseListener);
  if (mapDblClickListener) google.maps.event.removeListener(mapDblClickListener);
  mapClickListener = mapMouseListener = mapDblClickListener = null;
}

function clearDrawPreview() {
  drawMarkers.forEach(m => m.setMap(null)); drawMarkers = [];
  if (drawPolyline) { drawPolyline.setMap(null); drawPolyline = null; }
  if (circleOverlay) { circleOverlay.setMap(null); circleOverlay = null; }
  if (rectOverlay)   { rectOverlay.setMap(null);   rectOverlay = null;   }
  drawPoints = []; dragStart = null;
}

function startDrawing(mode) {
  if (!document.getElementById('t-vertical').value) { alert('Select a vertical first'); return; }
  if (!document.getElementById('t-staff').value)    { alert('Select a TL first'); return; }
  if (!document.getElementById('t-name').value.trim()) { alert('Enter a territory name'); return; }
  if (!territoryMap) { setTimeout(() => startDrawing(mode), 800); return; }

  clearDrawListeners();
  clearDrawPreview();
  drawMode = mode;
  const color = getSelectedColor();

  const hintEl = document.getElementById('draw-hint');

  if (mode === 'circle') {
    // Show radius input panel
    showCircleRadiusPanel(color, hintEl);

  } else if (mode === 'polygon') {
    if (hintEl) {
      hintEl.textContent = '👆 Click points on map. Click first point again OR press Finish to close.';
      hintEl.style.display = 'block';
      hintEl.style.cssText += 'background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:#22C55E;';
    }
    territoryMap.setOptions({ draggableCursor: 'crosshair' });

    drawPolyline = new google.maps.Polyline({
      path: [], strokeColor: color, strokeWeight: 2, strokeOpacity: 0.8, map: territoryMap,
    });

    mapClickListener = territoryMap.addListener('click', e => {
      const pt = { lat: e.latLng.lat(), lng: e.latLng.lng() };
      drawPoints.push(pt);
      drawPolyline.getPath().push(e.latLng);
      const marker = new google.maps.Marker({
        position: pt, map: territoryMap,
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 6,
                fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 1 }
      });
      drawMarkers.push(marker);
      if (hintEl && drawPoints.length >= 3) {
        hintEl.textContent = drawPoints.length + ' points — click Finish button to save';
      }
    });

    // Show finish button
    showFinishButton(color);

  } else if (mode === 'rectangle') {
    if (hintEl) {
      hintEl.textContent = '👆 Click first corner, then click opposite corner to finish.';
      hintEl.style.display = 'block';
    }
    territoryMap.setOptions({ draggableCursor: 'crosshair' });
    let corner1 = null;

    mapClickListener = territoryMap.addListener('click', e => {
      if (!corner1) {
        corner1 = e.latLng;
        const marker = new google.maps.Marker({
          position: corner1, map: territoryMap,
          icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7,
                  fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 }
        });
        drawMarkers.push(marker);
        if (hintEl) hintEl.textContent = '👆 Now click the opposite corner to finish';
      } else {
        const sw = { lat: Math.min(corner1.lat(), e.latLng.lat()), lng: Math.min(corner1.lng(), e.latLng.lng()) };
        const ne = { lat: Math.max(corner1.lat(), e.latLng.lat()), lng: Math.max(corner1.lng(), e.latLng.lng()) };
        const coords = [[sw.lng,sw.lat],[ne.lng,sw.lat],[ne.lng,ne.lat],[sw.lng,ne.lat],[sw.lng,sw.lat]];
        const geojson = { type:'Feature', geometry:{ type:'Polygon', coordinates:[coords] }, properties:{ shape:'rectangle' } };
        clearDrawListeners();
        clearDrawPreview();
        territoryMap.setOptions({ draggableCursor: null });
        if (hintEl) hintEl.style.display = 'none';
        showSaveConfirm(geojson, null);
      }
    });
  }
}

function saveCircleTerritory(color) {
  const centre = window._circleCentreRef?.();
  if (!centre) { alert('Click on map to set centre first'); return; }
  const radiusM = parseFloat(document.getElementById('circle-radius-km')?.value || 15) * 1000;

  // Build GeoJSON polygon from circle
  const coords = [];
  for (let i = 0; i <= 64; i++) {
    const angle = (i / 64) * 2 * Math.PI;
    const latOff = (radiusM / 111320) * Math.cos(angle);
    const lngOff = (radiusM / (111320 * Math.cos(centre.lat() * Math.PI / 180))) * Math.sin(angle);
    coords.push([centre.lng() + lngOff, centre.lat() + latOff]);
  }
  const geojson = { type:'Feature', geometry:{ type:'Polygon', coordinates:[coords] },
    properties:{ shape:'circle', center_lat: centre.lat(), center_lng: centre.lng(), radius_m: radiusM } };

  clearDrawListeners();
  clearDrawPreview();
  document.getElementById('circle-radius-panel')?.remove();
  territoryMap.setOptions({ draggableCursor: null });
  showSaveConfirm(geojson, null);
}

}


function haversineDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
    Math.sin(dLng/2) * Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function saveTerritory() {
  const geojson = window._pendingGeoJSON;
  if (!geojson) { alert('No territory drawn — please draw first'); return; }

  const name     = document.getElementById('t-name')?.value?.trim();
  const vertCode = document.getElementById('t-vertical')?.value;
  const staffId  = parseInt(document.getElementById('t-staff')?.value) || null;

  if (!name)     { alert('Enter a territory name'); return; }

  try {
    const res = await fetch(SB_URL + '/rest/v1/territories', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': ANON,
        'Authorization': 'Bearer ' + (_adminSession?.access_token || ANON),
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        name, vertical_code: vertCode,
        staff_id: staffId, color,
        polygon_geojson: geojson,
        active: true
      })
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText || 'HTTP ' + res.status);
    }

    // Success
    document.getElementById('save-confirm-panel')?.remove();
    document.getElementById('circle-radius-panel')?.remove();
    document.getElementById('finish-polygon-btn')?.remove();
    document.getElementById('draw-hint') && (document.getElementById('draw-hint').style.display = 'none');
    clearDrawListeners();
    clearDrawPreview();
    if (territoryMap) territoryMap.setOptions({ draggableCursor: null });
    window._pendingGeoJSON = null;
    document.getElementById('t-name').value = '';

    // Reload
    territories = await sbFetch('territories?select=*,staff:staff_id(name,designation)&active=eq.true&order=created_at.desc').catch(()=>[]);
    renderTerritoryList();
    renderTerritoriesOnMap();
    toast('Territory saved ✓', 'ok');

  } catch(e) {
    console.error('[saveTerritory]', e);
    alert('Save failed: ' + e.message);
    if (saveBtn) { saveBtn.textContent = '💾 Save Territory'; saveBtn.disabled = false; }
  }
}

function renderTerritoriesOnMap() {
  if (!territoryMap) return;
  // Clear existing overlays
  territoryPolygons.forEach(p => p.setMap(null));
  territoryPolygons = [];

  (territories||[]).forEach(t => {
    if (!t.polygon_geojson?.geometry?.coordinates) return;
    const coords = t.polygon_geojson.geometry.coordinates[0].map(([lng, lat]) => ({ lat, lng }));
    const color = t.color || '#F5A623';

    const poly = new google.maps.Polygon({
      paths: coords,
      fillColor: color, fillOpacity: 0.2,
      strokeColor: color, strokeWeight: 2,
      map: territoryMap,
    });

    // Info window on click
    const iw = new google.maps.InfoWindow();
    poly.addListener('click', e => {
      iw.setContent(`<div style="font-family:sans-serif;padding:4px;">
        <div style="font-weight:700;font-size:14px;">${t.name}</div>
        <div style="color:#666;font-size:12px;margin-top:2px;">${t.staff?.name||'Unassigned'}</div>
        <button onclick="deleteTerritory(${t.id})"
          style="margin-top:8px;padding:4px 10px;border-radius:6px;background:#EF4444;
          border:none;color:#fff;font-size:11px;cursor:pointer;">Delete</button>
      </div>`);
      iw.setPosition(e.latLng);
      iw.open(territoryMap);
    });

    // Label at polygon centre
    const lats = coords.map(c => c.lat);
    const lngs = coords.map(c => c.lng);
    const centerLat = (Math.max(...lats) + Math.min(...lats)) / 2;
    const centerLng = (Math.max(...lngs) + Math.min(...lngs)) / 2;

    new google.maps.Marker({
      position: { lat: centerLat, lng: centerLng },
      map: territoryMap,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 0 },
      label: { text: t.name.split('—').pop().trim().substring(0, 15), color, fontSize: '11px', fontWeight: '700' }
    });

    territoryPolygons.push(poly);
  });
}

  let done = 0, failed = 0;
  for (const v of needsAI) {

        if (statusEl) statusEl.textContent = `🤖 Processing: ${done}/${needsAI.length} done... ${failed ? '('+failed+' skipped)' : ''}`;
      } else {
        const err = await res.json().catch(()=>({}));
        console.warn('AI failed for visit', v.id, err);
        failed++;
      }
      await new Promise(r => setTimeout(r, 800)); // pace requests
    } catch(e) {
      console.warn('AI retry error visit', v.id, e);
      failed++;
    }
  }

  if (statusEl) statusEl.textContent = `✅ Done — ${done} analysed${failed ? ', '+failed+' skipped (no photos)' : ''}`;
  if (btn) { btn.disabled = false; btn.innerHTML = '🤖 <span>Run AI on all visits</span>'; }
  setTimeout(() => loadFieldVisits(), 1500);
}

window.retryAISingle = retryAISingle;
window.retryAIBulk = retryAIBulk;

async function markVisitConverted(visitId) {
  const invoiceInput = document.getElementById('conv-invoice-id');
  const valueInput = document.getElementById('conv-value');
  const invoiceId = invoiceInput?.value?.trim();
  const value = parseFloat(valueInput?.value || 0);

  if (!invoiceId) { toast('Enter Invoice ID or number', 'warn'); return; }

  const btn = document.querySelector(`button[onclick="markVisitConverted(${visitId})"]`);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  await sbFetch(`field_visits?id=eq.${visitId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({
      converted_invoice_id: parseInt(invoiceId) || null,
      converted_at: new Date().toISOString(),
      conversion_value: value || null,
    })
  }).catch(e => { toast('Error: ' + e.message, 'err'); });

  toast('✅ Visit marked as converted', 'ok');
  showVisitDetail(visitId); // Refresh detail panel
}
window.markVisitConverted = markVisitConverted;


// ── INIT ──
const savedSession = localStorage.getItem('vw_admin_session');
const savedProfile = localStorage.getItem('vw_admin_profile');
if (savedSession && savedProfile) {
  try {
    _adminSession = JSON.parse(savedSession);
    _adminProfile = JSON.parse(savedProfile);

    // Check if JWT is expired or expiring soon (within 10 min)
    const exp = _adminSession?.expires_at || _adminSession?.expires_in;
    const expiresAt = _adminSession?.expires_at
      ? new Date(_adminSession.expires_at * 1000)
      : new Date(Date.now() + (_adminSession?.expires_in || 3600) * 1000);
    const tenMinFromNow = new Date(Date.now() + 10 * 60 * 1000);

    if (expiresAt < tenMinFromNow && _adminSession?.refresh_token) {
      // Refresh silently
      fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': ANON },
        body: JSON.stringify({ refresh_token: _adminSession.refresh_token })
      }).then(r => r.json()).then(data => {
        if (data.access_token) {
          _adminSession = data;
          localStorage.setItem('vw_admin_session', JSON.stringify(data));
        }
      }).catch(() => {}).finally(() => startAdminApp());
    } else {
      startAdminApp();
    }
  } catch(e) { /* show login */ }
}

// Auto-refresh token every 30 minutes while admin is open
setInterval(async () => {
  if (!_adminSession?.refresh_token) return;
  try {
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON },
      body: JSON.stringify({ refresh_token: _adminSession.refresh_token })
    });
    const data = await r.json();
    if (data.access_token) {
      _adminSession = data;
      localStorage.setItem('vw_admin_session', JSON.stringify(data));
    }
  } catch(e) { console.warn('Token refresh failed:', e); }
}, 30 * 60 * 1000);
